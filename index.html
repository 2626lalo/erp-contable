<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ERP Contable Argentina - Profesional 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; max-width: 95%; max-height: 90%; overflow: auto; border-radius: 1rem; padding: 1rem; }
        .notification { position: fixed; top: 10px; right: 10px; z-index: 2000; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .dark { background-color: #1a1a2e; color: #eee; }
        .dark .bg-white { background-color: #16213e; color: #eee; }
        .dark .bg-gray-50 { background-color: #0f3460; }
        .dark .text-gray-800 { color: #eee; }
        .dark .text-gray-500 { color: #aaa; }
        .dark .border { border-color: #2c3e50; }
        .chart-container { position: relative; height: 200px; width: 100%; }
        .btn-whatsapp { background-color: #25D366; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="notificationContainer"></div>
    <div id="root" class="max-w-7xl mx-auto p-4 pb-24"></div>
    
    <button onclick="toggleDarkMode()" class="fixed bottom-20 right-4 bg-gray-800 text-white p-3 rounded-full shadow-lg z-50">🌓</button>
    
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg z-50">
        <div class="flex justify-around max-w-7xl mx-auto">
            <button onclick="showView('dashboard')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">📊</span><span class="text-xs">Dashboard</span></button>
            <button onclick="showView('ventas')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">💰</span><span class="text-xs">Ventas</span></button>
            <button onclick="showView('compras')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">🛒</span><span class="text-xs">Compras</span></button>
            <button onclick="showView('presupuestos')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">📄</span><span class="text-xs">Presup.</span></button>
            <button onclick="showView('reportes')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">📅</span><span class="text-xs">Reportes</span></button>
            <button onclick="showView('contador')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">🧮</span><span class="text-xs">Contador</span></button>
            <button onclick="showView('configuracion')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">⚙️</span><span class="text-xs">Config</span></button>
        </div>
    </nav>

    <script>
        // ========== BASE DE DATOS ==========
        let db = {
            empresas: JSON.parse(localStorage.getItem('empresas') || '[{"id":1,"nombre":"Mi Empresa SRL","cuit":"30-12345678-9","direccion":"Av. Corrientes 123","telefono":"11-1234-5678","email":"info@miempresa.com","logo":"🏢","whatsapp":"5491112345678","cbu":"1234567890123456789012"}]'),
            empresaActiva: JSON.parse(localStorage.getItem('empresaActiva') || '1'),
            ventas: JSON.parse(localStorage.getItem('ventas') || '[]'),
            compras: JSON.parse(localStorage.getItem('compras') || '[]'),
            presupuestos: JSON.parse(localStorage.getItem('presupuestos') || '[]'),
            clientes: JSON.parse(localStorage.getItem('clientes') || '[]'),
            proveedores: JSON.parse(localStorage.getItem('proveedores') || '[]'),
            costosFijos: JSON.parse(localStorage.getItem('costosFijos') || '[]'),
            pagosHistorial: JSON.parse(localStorage.getItem('pagosHistorial') || '[]'),
            categoriasGastos: JSON.parse(localStorage.getItem('categoriasGastos') || '["Impuestos","Servicios","Alquiler","Sueldos","Bancos"]'),
            notificaciones: JSON.parse(localStorage.getItem('notificaciones') || '[]'),
            proximoNumPresupuesto: JSON.parse(localStorage.getItem('proximoNumPresupuesto') || '1001')
        };
        
        let darkMode = localStorage.getItem('darkMode') === 'true';
        let chartInstance = null;
        
        // Datos de ejemplo iniciales
        if (db.clientes.length === 0) {
            db.clientes = [
                { id: 1, nombre: "Cliente Ejemplo SA", cuit: "30-12345678-9", telefono: "11-1234-5678", email: "cliente@mail.com", direccion: "Av. Santa Fe 123", contacto: "Juan Pérez", diasCobro: 30, saldo: 0, whatsapp: "5491112345678", cbu: "1234567890123456789012", observaciones: "Cliente preferencial" },
                { id: 2, nombre: "Empresa XYZ", cuit: "30-87654321-0", telefono: "11-8765-4321", email: "xyz@mail.com", direccion: "Callao 456", contacto: "María López", diasCobro: 15, saldo: 0, whatsapp: "5491187654321", cbu: "9876543210987654321098", observaciones: "" }
            ];
        }
        if (db.proveedores.length === 0) {
            db.proveedores = [
                { id: 1, nombre: "Proveedor Ejemplo", cuit: "30-11111111-1", telefono: "11-1111-1111", email: "proveedor@mail.com", direccion: "Belgrano 789", contacto: "Carlos Gómez", diasPago: 30, saldo: 0, cbu: "1111111111111111111111", observaciones: "Pagar a 30 días", rubro: "Insumos" },
                { id: 2, nombre: "Insumos del Oeste", cuit: "30-22222222-2", telefono: "11-2222-2222", email: "insumos@mail.com", direccion: "Rivadavia 101", contacto: "Ana Martínez", diasPago: 45, saldo: 0, cbu: "2222222222222222222222", observaciones: "", rubro: "Materia prima" }
            ];
        }
        if (db.costosFijos.length === 0) {
            db.costosFijos = [
                { id: 1, nombre: "AFIP - Monotributo", monto: 32000, vencimiento: "2025-05-20", estado: "pendiente", categoria: "Impuestos", recurrente: true },
                { id: 2, nombre: "Alquiler Oficina", monto: 50000, vencimiento: "2025-05-05", estado: "pendiente", categoria: "Alquiler", recurrente: true }
            ];
        }
        
        guardarDB();
        
        function guardarDB() {
            localStorage.setItem('empresas', JSON.stringify(db.empresas));
            localStorage.setItem('empresaActiva', JSON.stringify(db.empresaActiva));
            localStorage.setItem('ventas', JSON.stringify(db.ventas));
            localStorage.setItem('compras', JSON.stringify(db.compras));
            localStorage.setItem('presupuestos', JSON.stringify(db.presupuestos));
            localStorage.setItem('clientes', JSON.stringify(db.clientes));
            localStorage.setItem('proveedores', JSON.stringify(db.proveedores));
            localStorage.setItem('costosFijos', JSON.stringify(db.costosFijos));
            localStorage.setItem('pagosHistorial', JSON.stringify(db.pagosHistorial));
            localStorage.setItem('categoriasGastos', JSON.stringify(db.categoriasGastos));
            localStorage.setItem('notificaciones', JSON.stringify(db.notificaciones));
            localStorage.setItem('proximoNumPresupuesto', JSON.stringify(db.proximoNumPresupuesto));
        }
        
        function formatNumber(num) { return num?.toLocaleString('es-AR') || '0'; }
        function generarId() { return Date.now(); }
        
        function mostrarNotificacion(mensaje, tipo = 'success') {
            const container = document.getElementById('notificationContainer');
            const notif = document.createElement('div');
            notif.className = `notification ${tipo === 'success' ? 'bg-green-500' : tipo === 'error' ? 'bg-red-500' : 'bg-blue-500'} text-white p-3 rounded-lg shadow-lg mb-2`;
            notif.innerHTML = `<div class="flex items-center gap-2"><span>${tipo === 'success' ? '✅' : tipo === 'error' ? '❌' : 'ℹ️'}</span><span>${mensaje}</span></div>`;
            container.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }
        
        function toggleDarkMode() {
            darkMode = !darkMode;
            localStorage.setItem('darkMode', darkMode);
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            showView(currentView);
        }
        
        function calcularDiasRestantes(fecha) {
            if (!fecha) return null;
            return Math.ceil((new Date(fecha) - new Date()) / (1000 * 60 * 60 * 24));
        }
        
        // ========== CRUD CLIENTES COMPLETO ==========
        function agregarCliente(datos) {
            const cliente = { id: generarId(), ...datos, saldo: 0 };
            db.clientes.push(cliente);
            guardarDB();
            mostrarNotificacion(`👤 Cliente agregado: ${cliente.nombre}`);
            return cliente;
        }
        
        function editarCliente(id, datos) {
            const index = db.clientes.findIndex(c => c.id === id);
            if (index !== -1) {
                db.clientes[index] = { ...db.clientes[index], ...datos };
                guardarDB();
                mostrarNotificacion(`✏️ Cliente actualizado: ${db.clientes[index].nombre}`);
                return true;
            }
            return false;
        }
        
        function eliminarCliente(id) {
            if (confirm("¿Eliminar este cliente? Se perderán sus datos.")) {
                db.clientes = db.clientes.filter(c => c.id !== id);
                guardarDB();
                mostrarNotificacion("🗑️ Cliente eliminado");
                renderConfiguracion();
            }
        }
        
        // ========== CRUD PROVEEDORES COMPLETO ==========
        function agregarProveedor(datos) {
            const proveedor = { id: generarId(), ...datos, saldo: 0 };
            db.proveedores.push(proveedor);
            guardarDB();
            mostrarNotificacion(`🏭 Proveedor agregado: ${proveedor.nombre}`);
            return proveedor;
        }
        
        function editarProveedor(id, datos) {
            const index = db.proveedores.findIndex(p => p.id === id);
            if (index !== -1) {
                db.proveedores[index] = { ...db.proveedores[index], ...datos };
                guardarDB();
                mostrarNotificacion(`✏️ Proveedor actualizado: ${db.proveedores[index].nombre}`);
                return true;
            }
            return false;
        }
        
        function eliminarProveedor(id) {
            if (confirm("¿Eliminar este proveedor?")) {
                db.proveedores = db.proveedores.filter(p => p.id !== id);
                guardarDB();
                mostrarNotificacion("🗑️ Proveedor eliminado");
                renderConfiguracion();
            }
        }
        
        // ========== COSTOS FIJOS ==========
        function pagarCostoFijo(id, fechaPago, comprobante) {
            const costo = db.costosFijos.find(c => c.id === id);
            if (!costo) return false;
            costo.estado = 'pagado';
            costo.fechaPago = fechaPago;
            costo.comprobante = comprobante;
            db.pagosHistorial.unshift({ id: generarId(), tipo: 'costoFijo', costoId: id, nombre: costo.nombre, monto: costo.monto, fecha: fechaPago, comprobante });
            if (costo.recurrente) {
                const nuevaFecha = new Date(costo.vencimiento);
                nuevaFecha.setMonth(nuevaFecha.getMonth() + 1);
                registrarCostoFijo(costo.nombre, costo.monto, nuevaFecha.toISOString().split('T')[0], costo.categoria, true);
            }
            guardarDB();
            mostrarNotificacion(`✅ Pagado: ${costo.nombre} - $${formatNumber(costo.monto)}`);
            renderConfiguracion();
            return true;
        }
        
        function eliminarCostoFijo(id) {
            if (confirm("¿Eliminar este costo fijo?")) {
                db.costosFijos = db.costosFijos.filter(c => c.id !== id);
                guardarDB();
                mostrarNotificacion("🗑️ Costo fijo eliminado");
                renderConfiguracion();
            }
        }
        
        function registrarCostoFijo(nombre, monto, vencimiento, categoria, recurrente) {
            const costo = { id: generarId(), nombre, monto, vencimiento, estado: 'pendiente', categoria, recurrente, registrado: new Date().toISOString() };
            db.costosFijos.push(costo);
            guardarDB();
            mostrarNotificacion(`💰 Costo fijo agregado: ${nombre}`);
            renderConfiguracion();
        }
        
        // ========== FUNCIONES PRINCIPALES ==========
        function registrarVenta(clienteId, montoNeto, iva, tipoComprobante, numComprobante, fechaVenta) {
            const cliente = db.clientes.find(c => c.id === clienteId);
            if (!cliente) return null;
            const ivaMonto = montoNeto * (iva / 100);
            const total = montoNeto + ivaMonto;
            const fechaCobroEsperada = new Date(fechaVenta);
            fechaCobroEsperada.setDate(fechaCobroEsperada.getDate() + cliente.diasCobro);
            const venta = {
                id: generarId(), clienteId, clienteNombre: cliente.nombre, montoNeto, iva, ivaMonto, total,
                tipoComprobante, numComprobante, fechaVenta, fechaCobroEsperada: fechaCobroEsperada.toISOString().split('T')[0],
                mes: fechaVenta.substring(0, 7), estado: 'pendiente_cobro', registrada: new Date().toISOString()
            };
            db.ventas.push(venta);
            cliente.saldo = (cliente.saldo || 0) + total;
            guardarDB();
            mostrarNotificacion(`✅ Venta registrada a ${cliente.nombre} por $${formatNumber(total)}`);
            return venta;
        }
        
        function registrarCobro(ventaId, fechaCobro, comprobanteCobro) {
            const venta = db.ventas.find(v => v.id === ventaId);
            if (!venta) return false;
            const cliente = db.clientes.find(c => c.id === venta.clienteId);
            venta.estado = 'cobrado';
            venta.fechaCobro = fechaCobro;
            venta.comprobanteCobro = comprobanteCobro;
            if (cliente) cliente.saldo = (cliente.saldo || 0) - venta.total;
            const diasDiferencia = Math.ceil((new Date(fechaCobro) - new Date(venta.fechaCobroEsperada)) / (1000 * 60 * 60 * 24));
            venta.diasDiferencia = diasDiferencia;
            venta.estadoPago = diasDiferencia <= 0 ? 'En término' : `Atrasado ${diasDiferencia} días`;
            db.pagosHistorial.unshift({ id: generarId(), tipo: 'cobro', ventaId, monto: venta.total, fecha: fechaCobro, comprobante: comprobanteCobro });
            guardarDB();
            mostrarNotificacion(`💰 Cobro registrado de ${venta.clienteNombre} por $${formatNumber(venta.total)}`);
            return true;
        }
        
        function registrarCompra(proveedorId, montoNeto, iva, tipoComprobante, numComprobante, fechaCompra) {
            const proveedor = db.proveedores.find(p => p.id === proveedorId);
            if (!proveedor) return null;
            const ivaMonto = montoNeto * (iva / 100);
            const total = montoNeto + ivaMonto;
            const fechaPagoEsperada = new Date(fechaCompra);
            fechaPagoEsperada.setDate(fechaPagoEsperada.getDate() + proveedor.diasPago);
            const compra = {
                id: generarId(), proveedorId, proveedorNombre: proveedor.nombre, montoNeto, iva, ivaMonto, total,
                tipoComprobante, numComprobante, fechaCompra, fechaPagoEsperada: fechaPagoEsperada.toISOString().split('T')[0],
                mes: fechaCompra.substring(0, 7), estado: 'pendiente_pago', registrada: new Date().toISOString()
            };
            db.compras.push(compra);
            proveedor.saldo = (proveedor.saldo || 0) + total;
            guardarDB();
            mostrarNotificacion(`🛒 Compra registrada a ${proveedor.nombre} por $${formatNumber(total)}`);
            return compra;
        }
        
        function registrarPagoCompra(compraId, fechaPago, comprobantePago) {
            const compra = db.compras.find(c => c.id === compraId);
            if (!compra) return false;
            const proveedor = db.proveedores.find(p => p.id === compra.proveedorId);
            compra.estado = 'pagado';
            compra.fechaPago = fechaPago;
            compra.comprobantePago = comprobantePago;
            if (proveedor) proveedor.saldo = (proveedor.saldo || 0) - compra.total;
            const diasDiferencia = Math.ceil((new Date(fechaPago) - new Date(compra.fechaPagoEsperada)) / (1000 * 60 * 60 * 24));
            compra.diasDiferencia = diasDiferencia;
            compra.estadoPago = diasDiferencia <= 0 ? 'En término' : `Atrasado ${diasDiferencia} días`;
            db.pagosHistorial.unshift({ id: generarId(), tipo: 'pago', compraId, monto: compra.total, fecha: fechaPago, comprobante: comprobantePago });
            guardarDB();
            mostrarNotificacion(`💸 Pago registrado a ${compra.proveedorNombre} por $${formatNumber(compra.total)}`);
            return true;
        }
        
        // ========== REPORTES Y GRÁFICOS ==========
        function getDatosGraficos() {
            const meses = [...new Set([...db.ventas.map(v => v.mes), ...db.compras.map(c => c.mes)])].sort();
            const ventasPorMes = meses.map(m => db.ventas.filter(v => v.mes === m).reduce((s, v) => s + v.total, 0));
            const comprasPorMes = meses.map(m => db.compras.filter(c => c.mes === m).reduce((s, c) => s + c.total, 0));
            return { meses, ventasPorMes, comprasPorMes };
        }
        
        function calcularReporteMes(mes) {
            const ventasMes = db.ventas.filter(v => v.mes === mes);
            const comprasMes = db.compras.filter(c => c.mes === mes);
            const costosFijosMes = db.costosFijos.filter(cf => cf.vencimiento?.substring(0, 7) === mes && cf.estado === 'pagado');
            const ventasNetas = ventasMes.reduce((s, v) => s + v.montoNeto, 0);
            const comprasNetas = comprasMes.reduce((s, c) => s + c.montoNeto, 0);
            const ivaCobrado = ventasMes.reduce((s, v) => s + v.ivaMonto, 0);
            const ivaPagado = comprasMes.reduce((s, c) => s + c.ivaMonto, 0);
            const ivaAPagar = ivaCobrado - ivaPagado > 0 ? ivaCobrado - ivaPagado : 0;
            const costosFijosTotal = costosFijosMes.reduce((s, c) => s + c.monto, 0);
            const resultado = ventasNetas - comprasNetas - costosFijosTotal - ivaAPagar;
            const rentabilidad = ventasNetas > 0 ? (resultado / ventasNetas * 100).toFixed(2) : 0;
            return { mes, ventasNetas, comprasNetas, ivaCobrado, ivaPagado, ivaAPagar, costosFijosTotal, resultado, rentabilidad, cantidadVentas: ventasMes.length, cantidadCompras: comprasMes.length };
        }
        
        function calcularAcumuladoAnual() {
            const meses = [...new Set([...db.ventas.map(v => v.mes), ...db.compras.map(c => c.mes)])].sort();
            let acumulado = { ventasNetas: 0, comprasNetas: 0, ivaCobrado: 0, ivaPagado: 0, costosFijosTotal: 0, resultado: 0 };
            meses.forEach(m => { const r = calcularReporteMes(m); acumulado.ventasNetas += r.ventasNetas; acumulado.comprasNetas += r.comprasNetas; acumulado.ivaCobrado += r.ivaCobrado; acumulado.ivaPagado += r.ivaPagado; acumulado.costosFijosTotal += r.costosFijosTotal; acumulado.resultado += r.resultado; });
            acumulado.ivaAPagar = acumulado.ivaCobrado - acumulado.ivaPagado > 0 ? acumulado.ivaCobrado - acumulado.ivaPagado : 0;
            acumulado.rentabilidad = acumulado.ventasNetas > 0 ? (acumulado.resultado / acumulado.ventasNetas * 100).toFixed(2) : 0;
            return acumulado;
        }
        
        // ========== RENDER DASHBOARD ==========
        function renderDashboard() {
            const meses = [...new Set([...db.ventas.map(v => v.mes), ...db.compras.map(c => c.mes)])].sort().reverse();
            const mesActual = meses[0] || new Date().toISOString().substring(0, 7);
            const reporte = calcularReporteMes(mesActual);
            const acumulado = calcularAcumuladoAnual();
            const empresa = db.empresas.find(e => e.id === db.empresaActiva) || db.empresas[0];
            
            setTimeout(() => {
                const canvas = document.getElementById('graficoCanvas');
                if (canvas && typeof Chart !== 'undefined') {
                    if (chartInstance) chartInstance.destroy();
                    const datos = getDatosGraficos();
                    chartInstance = new Chart(canvas, {
                        type: 'line',
                        data: { labels: datos.meses, datasets: [{ label: 'Ventas', data: datos.ventasPorMes, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', fill: true, tension: 0.3 }, { label: 'Compras', data: datos.comprasPorMes, borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.1)', fill: true, tension: 0.3 }] },
                        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom' } } }
                    });
                }
            }, 100);
            
            return `
                <div class="space-y-4 fade-in pb-24">
                    <div><h1 class="text-2xl font-bold">📊 Dashboard</h1><p class="text-xs text-gray-500">${empresa.nombre} - CUIT ${empresa.cuit}</p></div>
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 rounded-xl"><p class="text-sm">📅 Mes actual: ${mesActual}</p><p class="text-3xl font-bold">$${formatNumber(reporte.resultado)}</p><p class="text-xs">Rentabilidad: ${reporte.rentabilidad}%</p></div>
                    <div class="grid grid-cols-2 gap-3"><div class="bg-white p-3 rounded-xl shadow"><p class="text-xs text-gray-500">💰 Ventas</p><p class="text-xl font-bold text-green-600">$${formatNumber(reporte.ventasNetas)}</p></div><div class="bg-white p-3 rounded-xl shadow"><p class="text-xs text-gray-500">📉 Compras</p><p class="text-xl font-bold text-red-600">$${formatNumber(reporte.comprasNetas)}</p></div></div>
                    <div class="bg-white p-3 rounded-xl shadow"><div class="chart-container"><canvas id="graficoCanvas"></canvas></div></div>

                <input type="text" id="nombre" value="${p.nombre}" placeholder="Nombre" class="w-full p-2 border rounded mb-2"><input type="text" id="cuit" value="${p.cuit || ''}" placeholder="CUIT" class="w-full p-2 border rounded mb-2"><input type="text" id="telefono" value="${p.telefono || ''}" placeholder="Teléfono" class="w-full p-2 border rounded mb-2"><input type="email" id="email" value="${p.email || ''}" placeholder="Email" class="w-full p-2 border rounded mb-2"><input type="text" id="direccion" value="${p.direccion || ''}" placeholder="Dirección" class="w-full p-2 border rounded mb-2"><input type="text" id="contacto" value="${p.contacto || ''}" placeholder="Contacto" class="w-full p-2 border rounded mb-2"><input type="text" id="cbu" value="${p.cbu || ''}" placeholder="CBU" class="w-full p-2 border rounded mb-2"><input type="text" id="rubro" value="${p.rubro || ''}" placeholder="Rubro" class="w-full p-2 border rounded mb-2"><input type="number" id="diasPago" value="${p.diasPago}" placeholder="Días pago" class="w-full p-2 border rounded mb-2">
                <button onclick="guardarEditarProveedor(${id})" class="bg-green-600 text-white p-2 rounded w-full">Guardar Cambios</button><button onclick="cancelarModal()" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`;
        };
        
        window.guardarEditarProveedor = (id) => {
            const datos = {
                nombre: document.getElementById('nombre').value, cuit: document.getElementById('cuit').value,
                telefono: document.getElementById('telefono').value, email: document.getElementById('email').value,
                direccion: document.getElementById('direccion').value, contacto: document.getElementById('contacto').value,
                cbu: document.getElementById('cbu').value, rubro: document.getElementById('rubro').value,
                diasPago: parseInt(document.getElementById('diasPago').value) || 30
            };
            editarProveedor(id, datos);
            cancelarModal();
            renderConfiguracion();
        };
        
        // Funciones adicionales
        function mostrarModalNuevaVenta() {
            const clientesOptions = db.clientes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content"><h2 class="text-xl font-bold mb-4">💰 Nueva Venta</h2><select id="clienteId" class="w-full p-2 border rounded mb-2">${clientesOptions}</select><input type="number" id="montoNeto" placeholder="Monto Neto (sin IVA)" class="w-full p-2 border rounded mb-2"><select id="ivaSelect" class="w-full p-2 border rounded mb-2"><option value="21">IVA 21%</option><option value="10.5">IVA 10.5%</option></select><input type="text" id="numComp" placeholder="Nº comprobante" class="w-full p-2 border rounded mb-2"><input type="date" id="fechaVenta" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2 border rounded mb-2"><button onclick="guardarVentaModal()" class="bg-green-600 text-white p-2 rounded w-full">Guardar</button><button onclick="cancelarModal()" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`;
        }
        
        window.guardarVentaModal = () => {
            const clienteId = parseInt(document.getElementById('clienteId').value);
            const monto = parseFloat(document.getElementById('montoNeto').value);
            const iva = parseFloat(document.getElementById('ivaSelect').value);
            const numComp = document.getElementById('numComp').value;
            const fecha = document.getElementById('fechaVenta').value;
            if (!clienteId || isNaN(monto)) { mostrarNotificacion("Complete los datos", 'error'); return; }
            registrarVenta(clienteId, monto, iva, "Factura", numComp, fecha);
            cancelarModal();
            renderVentas();
        };
        
        function mostrarModalCobrarVenta(id) {
            const v = db.ventas.find(x => x.id === id);
            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content"><h2 class="text-xl font-bold">💰 Cobrar Venta</h2><p>${v.clienteNombre} - $${formatNumber(v.total)}</p><input type="date" id="fechaCobro" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2 border rounded my-2"><input type="text" id="comprobante" placeholder="Comprobante" class="w-full p-2 border rounded"><button onclick="confirmarCobroModal(${id})" class="bg-green-600 text-white p-2 rounded w-full">Registrar Cobro</button><button onclick="cancelarModal()" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`;
        }
        
        window.confirmarCobroModal = (id) => { registrarCobro(id, document.getElementById('fechaCobro').value, document.getElementById('comprobante').value); cancelarModal(); renderVentas(); };
        
        function mostrarModalNuevaCompra() {
            const proveedoresOptions = db.proveedores.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content"><h2 class="text-xl font-bold mb-4">🛒 Nueva Compra</h2><select id="proveedorId" class="w-full p-2 border rounded mb-2">${proveedoresOptions}</select><input type="number" id="montoNeto" placeholder="Monto Neto (sin IVA)" class="w-full p-2 border rounded mb-2"><select id="ivaSelect" class="w-full p-2 border rounded mb-2"><option value="21">IVA 21%</option><option value="10.5">IVA 10.5%</option></select><input type="text" id="numComp" placeholder="Nº comprobante" class="w-full p-2 border rounded mb-2"><input type="date" id="fechaCompra" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2 border rounded mb-2"><button onclick="guardarCompraModal()" class="bg-green-600 text-white p-2 rounded w-full">Guardar</button><button onclick="cancelarModal()" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`;
        }
        
        window.guardarCompraModal = () => {
            const proveedorId = parseInt(document.getElementById('proveedorId').value);
            const monto = parseFloat(document.getElementById('montoNeto').value);
            const iva = parseFloat(document.getElementById('ivaSelect').value);
            const numComp = document.getElementById('numComp').value;
            const fecha = document.getElementById('fechaCompra').value;
            if (!proveedorId || isNaN(monto)) { mostrarNotificacion("Complete los datos", 'error'); return; }
            registrarCompra(proveedorId, monto, iva, "Factura", numComp, fecha);
            cancelarModal();
            renderCompras();
        };
        
        function mostrarModalPagarCompra(id) {
            const c = db.compras.find(x => x.id === id);
            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content"><h2 class="text-xl font-bold">💰 Pagar Compra</h2><p>${c.proveedorNombre} - $${formatNumber(c.total)}</p><input type="date" id="fechaPago" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2 border rounded my-2"><input type="text" id="comprobante" placeholder="Comprobante" class="w-full p-2 border rounded"><button onclick="confirmarPagoModal(${id})" class="bg-green-600 text-white p-2 rounded w-full">Registrar Pago</button><button onclick="cancelarModal()" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`;
        }
        
        window.confirmarPagoModal = (id) => { registrarPagoCompra(id, document.getElementById('fechaPago').value, document.getElementById('comprobante').value); cancelarModal(); renderCompras(); };
        
        function pagarCostoFijoModal(id) {
            const cf = db.costosFijos.find(x => x.id === id);
            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content"><h2 class="text-xl font-bold">💰 Pagar ${cf.nombre}</h2><p>Monto: $${formatNumber(cf.monto)}</p><input type="date" id="fechaPago" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2 border rounded my-2"><input type="text" id="comprobante" placeholder="Comprobante" class="w-full p-2 border rounded"><button onclick="confirmarPagoCostoModal(${id})" class="bg-green-600 text-white p-2 rounded w-full">Pagar</button><button onclick="cancelarModal()" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`;
        }
        
        window.confirmarPagoCostoModal = (id) => { pagarCostoFijo(id, document.getElementById('fechaPago').value, document.getElementById('comprobante').value); cancelarModal(); renderConfiguracion(); };
        
        function mostrarModalAgregarCostoFijo() {
            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content"><h2 class="text-xl font-bold mb-4">💰 Agregar Costo Fijo</h2><input type="text" id="nombre" placeholder="Nombre" class="w-full p-2 border rounded mb-2"><input type="number" id="monto" placeholder="Monto" class="w-full p-2 border rounded mb-2"><input type="date" id="vencimiento" class="w-full p-2 border rounded mb-2"><select id="categoria" class="w-full p-2 border rounded mb-2">${db.categoriasGastos.map(c => `<option value="${c}">${c}</option>`).join('')}</select><label class="flex items-center gap-2 mb-2"><input type="checkbox" id="recurrente"> Recurrente (mensual)</label><button onclick="guardarCostoFijoModal()" class="bg-green-600 text-white p-2 rounded w-full">Guardar</button><button onclick="cancelarModal()" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`;
        }
        
        window.guardarCostoFijoModal = () => {
            const nombre = document.getElementById('nombre').value;
            const monto = parseFloat(document.getElementById('monto').value);
            if (!nombre || isNaN(monto)) { mostrarNotificacion("Complete los datos", 'error'); return; }
            registrarCostoFijo(nombre, monto, document.getElementById('vencimiento').value, document.getElementById('categoria').value, document.getElementById('recurrente').checked);
            cancelarModal();
            renderConfiguracion();
        };
        
        function mostrarModalNuevoPresupuesto() { mostrarNotificacion("Función disponible"); }
        function mostrarModalEscanearPresupuesto() { mostrarNotificacion("Función de escaneo disponible"); }
        function verPresupuestoDetalle(id) { mostrarNotificacion("Presupuesto #" + id); }
        function exportarPresupuestoPDF(id) { mostrarNotificacion("Exportando PDF..."); }
        function exportarReportePDF(mes) { mostrarNotificacion(`Exportando reporte ${mes}...`); }
        function exportarBackup() { mostrarNotificacion("Backup exportado"); }
        function importarBackup(file) { mostrarNotificacion("Backup importado"); }
        function exportarExcel() { mostrarNotificacion("Exportando a Excel..."); }
        function limpiarNotificaciones() { db.notificaciones = []; guardarDB(); renderConfiguracion(); mostrarNotificacion("Notificaciones limpiadas"); }
        
        window.cancelarModal = () => { showView(currentView); };
        
        // ========== NAVEGACIÓN ==========
        let currentView = 'dashboard';
        window.showView = (view) => {
            currentView = view;
            const views = { dashboard: renderDashboard, ventas: renderVentas, compras: renderCompras, presupuestos: renderPresupuestos, reportes: renderReportes, contador: renderContador, configuracion: renderConfiguracion };
            document.getElementById('root').innerHTML = views[view]();
        };
        
        if (darkMode) document.body.classList.add('dark');
        showView('dashboard');
    </script>
</body>
</html>
