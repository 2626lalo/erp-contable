<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ERP Contable Argentina - Profesional 3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; max-width: 95%; max-height: 90%; overflow: auto; border-radius: 1rem; padding: 1rem; }
        .notification { position: fixed; top: 10px; right: 10px; z-index: 2000; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .dark { background-color: #1a1a2e; color: #eee; }
        .dark .bg-white { background-color: #16213e; color: #eee; }
        .dark .bg-gray-50 { background-color: #0f3460; }
        .dark .text-gray-800 { color: #eee; }
        .dark .text-gray-500 { color: #aaa; }
        .dark .border { border-color: #2c3e50; }
        .dark .shadow { box-shadow: none; }
        .chart-container { position: relative; height: 200px; width: 100%; }
        .btn-whatsapp { background-color: #25D366; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="notificationContainer"></div>
    <div id="root" class="max-w-7xl mx-auto p-4 pb-24"></div>
    
    <!-- Botón modo oscuro flotante -->
    <button onclick="toggleDarkMode()" class="fixed bottom-20 right-4 bg-gray-800 text-white p-3 rounded-full shadow-lg z-50">🌓</button>
    
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg z-50">
        <div class="flex justify-around max-w-7xl mx-auto">
            <button onclick="showView('dashboard')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">📊</span><span class="text-xs">Dashboard</span></button>
            <button onclick="showView('ventas')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">💰</span><span class="text-xs">Ventas</span></button>
            <button onclick="showView('compras')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">🛒</span><span class="text-xs">Compras</span></button>
            <button onclick="showView('presupuestos')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">📄</span><span class="text-xs">Presup.</span></button>
            <button onclick="showView('reportes')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">📅</span><span class="text-xs">Reportes</span></button>
            <button onclick="showView('contador')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">🧮</span><span class="text-xs">Contador</span></button>
            <button onclick="showView('configuracion')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">⚙️</span><span class="text-xs">Config</span></button>
        </div>
    </nav>

    <script>
        // ========== BASE DE DATOS ==========
        let db = {
            empresas: JSON.parse(localStorage.getItem('empresas') || '[{"id":1,"nombre":"Mi Empresa SRL","cuit":"30-12345678-9","direccion":"Av. Corrientes 123","telefono":"11-1234-5678","email":"info@miempresa.com","logo":"🏢","whatsapp":"5491112345678"}]'),
            empresaActiva: JSON.parse(localStorage.getItem('empresaActiva') || '1'),
            ventas: JSON.parse(localStorage.getItem('ventas') || '[]'),
            compras: JSON.parse(localStorage.getItem('compras') || '[]'),
            presupuestos: JSON.parse(localStorage.getItem('presupuestos') || '[]'),
            clientes: JSON.parse(localStorage.getItem('clientes') || '[]'),
            proveedores: JSON.parse(localStorage.getItem('proveedores') || '[]'),
            costosFijos: JSON.parse(localStorage.getItem('costosFijos') || '[]'),
            pagosHistorial: JSON.parse(localStorage.getItem('pagosHistorial') || '[]'),
            categoriasGastos: JSON.parse(localStorage.getItem('categoriasGastos') || '["Impuestos","Servicios","Alquiler","Sueldos","Bancos"]'),
            notificaciones: JSON.parse(localStorage.getItem('notificaciones') || '[]'),
            proximoNumPresupuesto: JSON.parse(localStorage.getItem('proximoNumPresupuesto') || '1001')
        };
        
        let darkMode = localStorage.getItem('darkMode') === 'true';
        let chartInstance = null;
        
        // Datos de ejemplo iniciales
        if (db.clientes.length === 0) {
            db.clientes = [
                { id: 1, nombre: "Cliente Ejemplo SA", cuit: "30-12345678-9", telefono: "11-1234-5678", email: "cliente@mail.com", direccion: "Av. Santa Fe 123", contacto: "Juan Pérez", diasCobro: 30, saldo: 0, whatsapp: "5491112345678" },
                { id: 2, nombre: "Empresa XYZ", cuit: "30-87654321-0", telefono: "11-8765-4321", email: "xyz@mail.com", direccion: "Callao 456", contacto: "María López", diasCobro: 15, saldo: 0, whatsapp: "5491187654321" }
            ];
        }
        if (db.proveedores.length === 0) {
            db.proveedores = [
                { id: 1, nombre: "Proveedor Ejemplo", cuit: "30-11111111-1", telefono: "11-1111-1111", email: "proveedor@mail.com", direccion: "Belgrano 789", contacto: "Carlos Gómez", diasPago: 30, saldo: 0 },
                { id: 2, nombre: "Insumos del Oeste", cuit: "30-22222222-2", telefono: "11-2222-2222", email: "insumos@mail.com", direccion: "Rivadavia 101", contacto: "Ana Martínez", diasPago: 45, saldo: 0 }
            ];
        }
        if (db.costosFijos.length === 0) {
            db.costosFijos = [
                { id: 1, nombre: "AFIP - Monotributo", monto: 32000, vencimiento: "2025-05-20", estado: "pendiente", categoria: "Impuestos", recurrente: true },
                { id: 2, nombre: "Alquiler Oficina", monto: 50000, vencimiento: "2025-05-05", estado: "pendiente", categoria: "Alquiler", recurrente: true }
            ];
        }
        
        // Generar datos de ejemplo para gráficos (últimos 6 meses)
        if (db.ventas.length === 0) {
            const meses = ["2025-01", "2025-02", "2025-03", "2025-04"];
            meses.forEach((mes, i) => {
                db.ventas.push({ id: generarId(), clienteId: 1, clienteNombre: "Cliente Ejemplo", montoNeto: 100000 + i * 20000, ivaMonto: 21000, total: 121000, fechaVenta: `${mes}-15`, mes: mes, estado: "cobrado" });
                db.compras.push({ id: generarId(), proveedorId: 1, proveedorNombre: "Proveedor Ejemplo", montoNeto: 50000 + i * 5000, ivaMonto: 10500, total: 60500, fechaCompra: `${mes}-10`, mes: mes, estado: "pagado" });
            });
        }
        
        function guardarDB() {
            localStorage.setItem('empresas', JSON.stringify(db.empresas));
            localStorage.setItem('empresaActiva', JSON.stringify(db.empresaActiva));
            localStorage.setItem('ventas', JSON.stringify(db.ventas));
            localStorage.setItem('compras', JSON.stringify(db.compras));
            localStorage.setItem('presupuestos', JSON.stringify(db.presupuestos));
            localStorage.setItem('clientes', JSON.stringify(db.clientes));
            localStorage.setItem('proveedores', JSON.stringify(db.proveedores));
            localStorage.setItem('costosFijos', JSON.stringify(db.costosFijos));
            localStorage.setItem('pagosHistorial', JSON.stringify(db.pagosHistorial));
            localStorage.setItem('categoriasGastos', JSON.stringify(db.categoriasGastos));
            localStorage.setItem('notificaciones', JSON.stringify(db.notificaciones));
            localStorage.setItem('proximoNumPresupuesto', JSON.stringify(db.proximoNumPresupuesto));
        }
        
        function formatNumber(num) { return num?.toLocaleString('es-AR') || '0'; }
        function generarId() { return Date.now(); }
        
        function mostrarNotificacion(mensaje, tipo = 'success') {
            const container = document.getElementById('notificationContainer');
            const notif = document.createElement('div');
            notif.className = `notification ${tipo === 'success' ? 'bg-green-500' : tipo === 'error' ? 'bg-red-500' : 'bg-blue-500'} text-white p-3 rounded-lg shadow-lg mb-2`;
            notif.innerHTML = `<div class="flex items-center gap-2"><span>${tipo === 'success' ? '✅' : tipo === 'error' ? '❌' : 'ℹ️'}</span><span>${mensaje}</span></div>`;
            container.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }
        
        function toggleDarkMode() {
            darkMode = !darkMode;
            localStorage.setItem('darkMode', darkMode);
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            showView(currentView);
        }
        
        function calcularDiasRestantes(fecha) {
            if (!fecha) return null;
            return Math.ceil((new Date(fecha) - new Date()) / (1000 * 60 * 60 * 24));
        }
        
        function verificarVencimientos() {
            const hoy = new Date().toISOString().split('T')[0];
            db.ventas.filter(v => v.estado === 'pendiente_cobro' && v.fechaCobroEsperada < hoy).forEach(v => {
                if (!db.notificaciones.some(n => n.mensaje.includes(v.clienteNombre))) {
                    db.notificaciones.unshift({ id: generarId(), tipo: 'cobro', mensaje: `⚠️ Venta vencida: ${v.clienteNombre} - $${formatNumber(v.total)}`, leida: false, fecha: hoy });
                }
            });
            db.compras.filter(c => c.estado === 'pendiente_pago' && c.fechaPagoEsperada < hoy).forEach(c => {
                if (!db.notificaciones.some(n => n.mensaje.includes(c.proveedorNombre))) {
                    db.notificaciones.unshift({ id: generarId(), tipo: 'pago', mensaje: `⚠️ Pago vencido: ${c.proveedorNombre} - $${formatNumber(c.total)}`, leida: false, fecha: hoy });
                }
            });
            guardarDB();
        }
        
        // ========== FUNCIONES PRINCIPALES ==========
        function registrarVenta(clienteId, montoNeto, iva, tipoComprobante, numComprobante, fechaVenta) {
            const cliente = db.clientes.find(c => c.id === clienteId);
            if (!cliente) return null;
            const ivaMonto = montoNeto * (iva / 100);
            const total = montoNeto + ivaMonto;
            const fechaCobroEsperada = new Date(fechaVenta);
            fechaCobroEsperada.setDate(fechaCobroEsperada.getDate() + cliente.diasCobro);
            const venta = {
                id: generarId(), clienteId, clienteNombre: cliente.nombre, montoNeto, iva, ivaMonto, total,
                tipoComprobante, numComprobante, fechaVenta, fechaCobroEsperada: fechaCobroEsperada.toISOString().split('T')[0],
                mes: fechaVenta.substring(0, 7), estado: 'pendiente_cobro', registrada: new Date().toISOString()
            };
            db.ventas.push(venta);
            cliente.saldo = (cliente.saldo || 0) + total;
            guardarDB();
            verificarVencimientos();
            mostrarNotificacion(`✅ Venta registrada a ${cliente.nombre} por $${formatNumber(total)}`);
            return venta;
        }
        
        function registrarCobro(ventaId, fechaCobro, comprobanteCobro) {
            const venta = db.ventas.find(v => v.id === ventaId);
            if (!venta) return false;
            const cliente = db.clientes.find(c => c.id === venta.clienteId);
            venta.estado = 'cobrado';
            venta.fechaCobro = fechaCobro;
            venta.comprobanteCobro = comprobanteCobro;
            if (cliente) cliente.saldo = (cliente.saldo || 0) - venta.total;
            const diasDiferencia = Math.ceil((new Date(fechaCobro) - new Date(venta.fechaCobroEsperada)) / (1000 * 60 * 60 * 24));
            venta.diasDiferencia = diasDiferencia;
            venta.estadoPago = diasDiferencia <= 0 ? 'En término' : `Atrasado ${diasDiferencia} días`;
            db.pagosHistorial.unshift({ id: generarId(), tipo: 'cobro', ventaId, monto: venta.total, fecha: fechaCobro, comprobante: comprobanteCobro });
            guardarDB();
            mostrarNotificacion(`💰 Cobro registrado de ${venta.clienteNombre} por $${formatNumber(venta.total)}`);
            return true;
        }
        
        function registrarCompra(proveedorId, montoNeto, iva, tipoComprobante, numComprobante, fechaCompra) {
            const proveedor = db.proveedores.find(p => p.id === proveedorId);
            if (!proveedor) return null;
            const ivaMonto = montoNeto * (iva / 100);
            const total = montoNeto + ivaMonto;
            const fechaPagoEsperada = new Date(fechaCompra);
            fechaPagoEsperada.setDate(fechaPagoEsperada.getDate() + proveedor.diasPago);
            const compra = {
                id: generarId(), proveedorId, proveedorNombre: proveedor.nombre, montoNeto, iva, ivaMonto, total,
                tipoComprobante, numComprobante, fechaCompra, fechaPagoEsperada: fechaPagoEsperada.toISOString().split('T')[0],
                mes: fechaCompra.substring(0, 7), estado: 'pendiente_pago', registrada: new Date().toISOString()
            };
            db.compras.push(compra);
            proveedor.saldo = (proveedor.saldo || 0) + total;
            guardarDB();
            verificarVencimientos();
            mostrarNotificacion(`🛒 Compra registrada a ${proveedor.nombre} por $${formatNumber(total)}`);
            return compra;
        }
        
        function registrarPagoCompra(compraId, fechaPago, comprobantePago) {
            const compra = db.compras.find(c => c.id === compraId);
            if (!compra) return false;
            const proveedor = db.proveedores.find(p => p.id === compra.proveedorId);
            compra.estado = 'pagado';
            compra.fechaPago = fechaPago;
            compra.comprobantePago = comprobantePago;
            if (proveedor) proveedor.saldo = (proveedor.saldo || 0) - compra.total;
            const diasDiferencia = Math.ceil((new Date(fechaPago) - new Date(compra.fechaPagoEsperada)) / (1000 * 60 * 60 * 24));
            compra.diasDiferencia = diasDiferencia;
            compra.estadoPago = diasDiferencia <= 0 ? 'En término' : `Atrasado ${diasDiferencia} días`;
            db.pagosHistorial.unshift({ id: generarId(), tipo: 'pago', compraId, monto: compra.total, fecha: fechaPago, comprobante: comprobantePago });
            guardarDB();
            mostrarNotificacion(`💸 Pago registrado a ${compra.proveedorNombre} por $${formatNumber(compra.total)}`);
            return true;
        }
        
        // ========== REPORTES Y GRÁFICOS ==========
        function getDatosGraficos() {
            const meses = [...new Set([...db.ventas.map(v => v.mes), ...db.compras.map(c => c.mes)])].sort();
            const ventasPorMes = meses.map(m => db.ventas.filter(v => v.mes === m).reduce((s, v) => s + v.total, 0));
            const comprasPorMes = meses.map(m => db.compras.filter(c => c.mes === m).reduce((s, c) => s + c.total, 0));
            const gananciasPorMes = meses.map((m, i) => ventasPorMes[i] - comprasPorMes[i]);
            return { meses, ventasPorMes, comprasPorMes, gananciasPorMes };
        }
        
        function calcularReporteMes(mes) {
            const ventasMes = db.ventas.filter(v => v.mes === mes);
            const comprasMes = db.compras.filter(c => c.mes === mes);
            const costosFijosMes = db.costosFijos.filter(cf => cf.vencimiento?.substring(0, 7) === mes && cf.estado === 'pagado');
            const ventasNetas = ventasMes.reduce((s, v) => s + v.montoNeto, 0);
            const comprasNetas = comprasMes.reduce((s, c) => s + c.montoNeto, 0);
            const ivaCobrado = ventasMes.reduce((s, v) => s + v.ivaMonto, 0);
            const ivaPagado = comprasMes.reduce((s, c) => s + c.ivaMonto, 0);
            const ivaAPagar = ivaCobrado - ivaPagado > 0 ? ivaCobrado - ivaPagado : 0;
            const costosFijosTotal = costosFijosMes.reduce((s, c) => s + c.monto, 0);
            const resultado = ventasNetas - comprasNetas - costosFijosTotal - ivaAPagar;
            const rentabilidad = ventasNetas > 0 ? (resultado / ventasNetas * 100).toFixed(2) : 0;
            return { mes, ventasNetas, comprasNetas, ivaCobrado, ivaPagado, ivaAPagar, costosFijosTotal, resultado, rentabilidad, cantidadVentas: ventasMes.length, cantidadCompras: comprasMes.length };
        }
        
        function calcularAcumuladoAnual() {
            const meses = [...new Set([...db.ventas.map(v => v.mes), ...db.compras.map(c => c.mes)])].sort();
            let acumulado = { ventasNetas: 0, comprasNetas: 0, ivaCobrado: 0, ivaPagado: 0, costosFijosTotal: 0, resultado: 0 };
            meses.forEach(m => { const r = calcularReporteMes(m); acumulado.ventasNetas += r.ventasNetas; acumulado.comprasNetas += r.comprasNetas; acumulado.ivaCobrado += r.ivaCobrado; acumulado.ivaPagado += r.ivaPagado; acumulado.costosFijosTotal += r.costosFijosTotal; acumulado.resultado += r.resultado; });
            acumulado.ivaAPagar = acumulado.ivaCobrado - acumulado.ivaPagado > 0 ? acumulado.ivaCobrado - acumulado.ivaPagado : 0;
            acumulado.rentabilidad = acumulado.ventasNetas > 0 ? (acumulado.resultado / acumulado.ventasNetas * 100).toFixed(2) : 0;
            return acumulado;
        }
        
        // ========== EXPORTAR DATOS ==========
        function exportarBackup() {
            const backup = { ...db, fechaBackup: new Date().toISOString() };
            const dataStr = JSON.stringify(backup, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `erp_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            mostrarNotificacion("📦 Backup exportado correctamente");
        }
        
        function importarBackup(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const backup = JSON.parse(e.target.result);
                    if (backup.ventas && backup.compras && backup.clientes) {
                        db = backup;
                        guardarDB();
                        mostrarNotificacion("✅ Backup importado correctamente");
                        showView(currentView);
                    } else { mostrarNotificacion("Archivo inválido", 'error'); }
                } catch(err) { mostrarNotificacion("Error al importar", 'error'); }
            };
            reader.readAsText(file);
        }
        
        function exportarExcel() {
            let csv = "Tipo,Fecha,Concepto,Monto Neto,IVA,Total,Estado\n";
            db.ventas.forEach(v => { csv += `Venta,${v.fechaVenta},${v.clienteNombre},${v.montoNeto},${v.ivaMonto},${v.total},${v.estado}\n`; });
            db.compras.forEach(c => { csv += `Compra,${c.fechaCompra},${c.proveedorNombre},${c.montoNeto},${c.ivaMonto},${c.total},${c.estado}\n`; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `erp_datos_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            mostrarNotificacion("📊 Datos exportados a CSV");
        }
        
        // ========== PRESUPUESTOS PROFESIONALES ==========
        function generarNumeroPresupuesto() {
            const num = db.proximoNumPresupuesto;
            db.proximoNumPresupuesto++;
            guardarDB();
            return `P-${num}`;
        }
        
        function enviarWhatsApp(numero, mensaje) {
            const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }
        
        // ========== RENDER DASHBOARD ==========
        function renderDashboard() {
            const meses = [...new Set([...db.ventas.map(v => v.mes), ...db.compras.map(c => c.mes)])].sort().reverse();
            const mesActual = meses[0] || new Date().toISOString().substring(0, 7);
            const reporte = calcularReporteMes(mesActual);
            const acumulado = calcularAcumuladoAnual();
            const notificacionesNoLeidas = db.notificaciones.filter(n => !n.leida).length;
            const empresa = db.empresas.find(e => e.id === db.empresaActiva) || db.empresas[0];
            
            setTimeout(() => {
                const canvas = document.getElementById('graficoCanvas');
                if (canvas && typeof Chart !== 'undefined') {
                    if (chartInstance) chartInstance.destroy();
                    const datos = getDatosGraficos();
                    chartInstance = new Chart(canvas, {
                        type: 'line',
                        data: { labels: datos.meses, datasets: [{ label: 'Ventas', data: datos.ventasPorMes, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', fill: true, tension: 0.3 }, { label: 'Compras', data: datos.comprasPorMes, borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.1)', fill: true, tension: 0.3 }] },
                        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom' } } }
                    });
                }
            }, 100);
            
            return `
                <div class="space-y-4 fade-in pb-24">
                    <div class="flex justify-between items-center"><div><h1 class="text-2xl font-bold">📊 Dashboard</h1><p class="text-xs text-gray-500">${empresa.nombre} - CUIT ${empresa.cuit}</p></div>${notificacionesNoLeidas > 0 ? `<div class="bg-red-500 text-white rounded-full px-2 py-1 text-xs">${notificacionesNoLeidas} notif.</div>` : ''}</div>
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 rounded-xl"><p class="text-sm">📅 Mes actual: ${mesActual}</p><p class="text-3xl font-bold">$${formatNumber(reporte.resultado)}</p><p class="text-xs">Rentabilidad: ${reporte.rentabilidad}%</p></div>
                    <div class="grid grid-cols-2 gap-3"><div class="bg-white p-3 rounded-xl shadow"><p class="text-xs text-gray-500">💰 Ventas</p><p class="text-xl font-bold text-green-600">$${formatNumber(reporte.ventasNetas)}</p></div><div class="bg-white p-3 rounded-xl shadow"><p class="text-xs text-gray-500">📉 Compras</p><p class="text-xl font-bold text-red-600">$${formatNumber(reporte.comprasNetas)}</p></div></div>

        function mostrarModalPagarCompra(id) {
            const c = db.compras.find(x => x.id === id);
            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content"><h2 class="text-xl font-bold">💰 Pagar Compra</h2><p>${c.proveedorNombre} - $${formatNumber(c.total)}</p><input type="date" id="fechaPago" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2 border rounded my-2"><input type="text" id="comprobante" placeholder="Comprobante" class="w-full p-2 border rounded"><button onclick="confirmarPagoModal(${id})" class="bg-green-600 text-white p-2 rounded w-full">Registrar Pago</button><button onclick="cancelarModal()" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`;
        }
        
        window.confirmarPagoModal = (id) => { registrarPagoCompra(id, document.getElementById('fechaPago').value, document.getElementById('comprobante').value); cancelarModal(); renderCompras(); };
        
        // Funciones básicas para configuración
        window.eliminarCliente = (id) => { if (confirm("¿Eliminar cliente?")) { db.clientes = db.clientes.filter(c => c.id !== id); guardarDB(); renderConfiguracion(); mostrarNotificacion("Cliente eliminado"); } };
        window.eliminarProveedor = (id) => { if (confirm("¿Eliminar proveedor?")) { db.proveedores = db.proveedores.filter(p => p.id !== id); guardarDB(); renderConfiguracion(); } };
        window.eliminarCostoFijo = (id) => { if (confirm("¿Eliminar costo fijo?")) { db.costosFijos = db.costosFijos.filter(c => c.id !== id); guardarDB(); renderConfiguracion(); } };
        window.limpiarNotificaciones = () => { db.notificaciones = []; guardarDB(); renderConfiguracion(); };
        window.cambiarEmpresaActiva = (id) => { db.empresaActiva = id; guardarDB(); renderConfiguracion(); };
        
        // Funciones placeholder
        window.verPresupuestoDetalle = (id) => { mostrarNotificacion("Presupuesto #" + id); };
        window.exportarPresupuestoPDF = (id) => { mostrarNotificacion("Exportando PDF..."); };
        window.enviarPresupuestoWhatsApp = (id) => { mostrarNotificacion("Abriendo WhatsApp..."); };
        
        // OCR y presupuestos
        let itemsPresupuestoOCR = [];
        function mostrarModalEscanearPresupuesto() {
            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content"><h2 class="text-xl font-bold mb-4">📷 Escanear Presupuesto</h2><input type="file" id="fileInput" accept="image/*" capture="environment" class="w-full p-2 border rounded mb-2"><div id="ocrProgress" class="hidden text-blue-600">Procesando OCR...</div><div id="itemsDetectados"></div><button id="aceptarOCR" class="hidden bg-green-600 text-white p-2 rounded w-full mt-2">Aceptar</button><button onclick="cancelarModal()" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`;
            const fileInput = document.getElementById('fileInput');
            fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                document.getElementById('ocrProgress').classList.remove('hidden');
                try {
                    const { data: { text } } = await Tesseract.recognize(file, 'spa');
                    const nums = text.match(/\d{2,6}[.,]?\d{0,2}/g) || [];
                    const precios = nums.filter(n => { const num = parseFloat(n.replace(',', '.')); return num > 100 && num < 10000000; }).slice(0, 8);
                    if (precios.length > 0) {
                        itemsPresupuestoOCR = precios.map(p => ({ desc: "Item detectado", cant: 1, costo: parseFloat(p.replace(',', '.')) }));
                        document.getElementById('itemsDetectados').innerHTML = `<p>✅ ${precios.length} items detectados</p>`;
                        document.getElementById('aceptarOCR').classList.remove('hidden');
                    } else { alert("No se detectaron precios"); }
                } catch(err) { alert("Error OCR"); }
                finally { document.getElementById('ocrProgress').classList.add('hidden'); }
            };
            document.getElementById('aceptarOCR').onclick = () => { mostrarModalNuevoPresupuestoConItems(itemsPresupuestoOCR); };
        }
        
        function mostrarModalNuevoPresupuesto() { mostrarModalNuevoPresupuestoConItems([]); }
        function mostrarModalNuevoPresupuestoConItems(itemsIniciales) {
            const clientesOptions = db.clientes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content w-full max-w-2xl"><h2 class="text-xl font-bold mb-4">📄 Nuevo Presupuesto</h2><select id="clienteId" class="w-full p-2 border rounded mb-2"><option value="">Seleccionar cliente...</option>${clientesOptions}</select><div id="itemsContainer">${(itemsIniciales.length ? itemsIniciales : [{ desc: "", cant: 1, costo: 0 }]).map((it, idx) => `<div class="flex gap-2 mb-1"><input placeholder="Producto" value="${it.desc}" class="itemDesc flex-1 border p-1 rounded"><input type="number" placeholder="Cant" value="${it.cant}" class="itemCant w-20 border p-1 rounded"><input type="number" placeholder="Precio" value="${it.costo}" class="itemPrecio w-28 border p-1 rounded"><button onclick="this.parentElement.remove()" class="text-red-500">🗑️</button></div>`).join('')}</div><button onclick="agregarItemPresupuestoUI()" class="bg-gray-200 p-1 rounded text-sm mb-2">+ Agregar item</button><div class="mb-2"><label>Margen: <span id="margenSpan">30</span>%</label><input type="range" id="margenSlider" min="0" max="200" value="30" class="w-full"></div><div id="totalPresupuesto" class="text-right font-bold text-lg mb-2">Total: $0</div><button onclick="guardarPresupuestoUI()" class="bg-green-600 text-white p-2 rounded w-full">Guardar</button><button onclick="cancelarModal()" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`;
            actualizarTotalPresupuestoUI();
            document.getElementById('margenSlider').oninput = (e) => { document.getElementById('margenSpan').innerText = e.target.value; actualizarTotalPresupuestoUI(); };
        }
        
        window.agregarItemPresupuestoUI = () => {
            const container = document.getElementById('itemsContainer');
            const div = document.createElement('div');
            div.className = 'flex gap-2 mb-1';
            div.innerHTML = `<input placeholder="Producto" class="itemDesc flex-1 border p-1 rounded"><input type="number" placeholder="Cant" value="1" class="itemCant w-20 border p-1 rounded"><input type="number" placeholder="Precio" class="itemPrecio w-28 border p-1 rounded"><button onclick="this.parentElement.remove();actualizarTotalPresupuestoUI()" class="text-red-500">🗑️</button>`;
            container.appendChild(div);
            div.querySelectorAll('input').forEach(i => i.addEventListener('input', () => actualizarTotalPresupuestoUI()));
        };
        
        function actualizarTotalPresupuestoUI() {
            let total = 0;
            const markup = parseInt(document.getElementById('margenSlider')?.value || 30) / 100;
            document.querySelectorAll('#itemsContainer .itemPrecio').forEach((p, i) => {
                const cant = parseFloat(document.querySelectorAll('.itemCant')[i]?.value || 1);
                const precio = parseFloat(p.value || 0);
                total += precio * (1 + markup) * cant;
            });
            const totalEl = document.getElementById('totalPresupuesto');
            if (totalEl) totalEl.innerText = `Total: $${formatNumber(total)}`;
        }
        
        window.guardarPresupuestoUI = () => {
            const clienteId = parseInt(document.getElementById('clienteId').value);
            const cliente = db.clientes.find(c => c.id === clienteId);
            if (!cliente) { mostrarNotificacion("Seleccione un cliente", 'error'); return; }
            const items = [];
            document.querySelectorAll('#itemsContainer .itemDesc').forEach((d, i) => {
                const desc = d.value;
                const cant = parseFloat(document.querySelectorAll('.itemCant')[i]?.value || 1);
                const precio = parseFloat(document.querySelectorAll('.itemPrecio')[i]?.value || 0);
                if (desc && precio > 0) items.push({ desc, cant, costo: precio });
            });
            if (items.length === 0) { mostrarNotificacion("Agregue al menos un item", 'error'); return; }
            const markup = parseInt(document.getElementById('margenSlider').value) / 100;
            const total = items.reduce((s, i) => s + i.costo * (1 + markup) * i.cant, 0);
            db.presupuestos.push({ id: generarId(), clienteId, cliente: cliente.nombre, items, markup: markup * 100, total, numero: generarNumeroPresupuesto(), fechaCreacion: new Date().toISOString(), estado: 'borrador' });
            guardarDB();
            mostrarNotificacion(`✅ Presupuesto ${db.presupuestos[db.presupuestos.length-1].numero} guardado para ${cliente.nombre} por $${formatNumber(total)}`);
            cancelarModal();
            renderPresupuestos();
        };
        
        window.cancelarModal = () => { showView(currentView); };
        
        // ========== NAVEGACIÓN ==========
        let currentView = 'dashboard';
        window.showView = (view) => {
            currentView = view;
            const views = { dashboard: renderDashboard, ventas: renderVentas, compras: renderCompras, presupuestos: renderPresupuestos, reportes: renderReportes, contador: renderContador, configuracion: renderConfiguracion };
            document.getElementById('root').innerHTML = views[view]();
        };
        
        if (darkMode) document.body.classList.add('dark');
        verificarVencimientos();
        showView('dashboard');
    </script>
</body>
</html>
