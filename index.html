<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ERP Contable Argentina - Reportes Mensuales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; max-width: 95%; max-height: 90%; overflow: auto; border-radius: 1rem; padding: 1rem; }
        .btn-camara { background: #2563eb; color: white; padding: 0.75rem; border-radius: 0.5rem; text-align: center; cursor: pointer; }
        .btn-galeria { background: #16a34a; color: white; padding: 0.75rem; border-radius: 0.5rem; text-align: center; cursor: pointer; margin-top: 0.5rem; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root" class="max-w-7xl mx-auto p-4 pb-24"></div>
    
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg z-50">
        <div class="flex justify-around max-w-7xl mx-auto">
            <button onclick="showView('dashboard')" class="tab-btn flex flex-col items-center py-2 px-2 text-gray-500"><span class="text-xl">📊</span><span class="text-xs">Dashboard</span></button>
            <button onclick="showView('ventas')" class="tab-btn flex flex-col items-center py-2 px-2 text-gray-500"><span class="text-xl">💰</span><span class="text-xs">Ventas</span></button>
            <button onclick="showView('compras')" class="tab-btn flex flex-col items-center py-2 px-2 text-gray-500"><span class="text-xl">🛒</span><span class="text-xs">Compras</span></button>
            <button onclick="showView('presupuestos')" class="tab-btn flex flex-col items-center py-2 px-2 text-gray-500"><span class="text-xl">📄</span><span class="text-xs">Presup.</span></button>
            <button onclick="showView('reportes')" class="tab-btn flex flex-col items-center py-2 px-2 text-gray-500"><span class="text-xl">📅</span><span class="text-xs">Reportes</span></button>
            <button onclick="showView('contador')" class="tab-btn flex flex-col items-center py-2 px-2 text-gray-500"><span class="text-xl">🧮</span><span class="text-xs">Contador</span></button>
        </div>
    </nav>

    <script>
        // ========== BASE DE DATOS ==========
        let db = {
            ventas: JSON.parse(localStorage.getItem('ventas') || '[]'),
            compras: JSON.parse(localStorage.getItem('compras') || '[]'),
            presupuestos: JSON.parse(localStorage.getItem('presupuestos') || '[]'),
            clientes: JSON.parse(localStorage.getItem('clientes') || '[{"id":1,"nombre":"Cliente Ejemplo SA","cuit":"30-12345678-9","telefono":"11-1234-5678","email":"cliente@mail.com","diasCobro":30},{"id":2,"nombre":"Empresa XYZ","cuit":"30-87654321-0","telefono":"11-8765-4321","email":"xyz@mail.com","diasCobro":15}]'),
            proveedores: JSON.parse(localStorage.getItem('proveedores') || '[{"id":1,"nombre":"Proveedor Ejemplo","cuit":"30-11111111-1","telefono":"11-1111-1111","contacto":"Juan","diasPago":30}]'),
            costosFijos: JSON.parse(localStorage.getItem('costosFijos') || '[{"id":1,"nombre":"AFIP Monotributo","monto":32000,"vencimiento":"2025-05-20","estado":"pendiente"},{"id":2,"nombre":"Alquiler","monto":50000,"vencimiento":"2025-05-05","estado":"pendiente"}]')
        };
        
        function guardarDB() {
            localStorage.setItem('ventas', JSON.stringify(db.ventas));
            localStorage.setItem('compras', JSON.stringify(db.compras));
            localStorage.setItem('presupuestos', JSON.stringify(db.presupuestos));
            localStorage.setItem('clientes', JSON.stringify(db.clientes));
            localStorage.setItem('proveedores', JSON.stringify(db.proveedores));
            localStorage.setItem('costosFijos', JSON.stringify(db.costosFijos));
        }
        
        function formatNumber(num) { return num?.toLocaleString('es-AR') || '0'; }
        function generarId() { return Date.now(); }
        
        function calcularDiasRestantes(fecha) {
            if (!fecha) return null;
            return Math.ceil((new Date(fecha) - new Date()) / (1000 * 60 * 60 * 24));
        }
        
        // ========== FUNCIONES DE VENTAS Y COMPRAS ==========
        function registrarVenta(cliente, montoNeto, iva, tipoComprobante, numComprobante, fechaVenta, diasCobro, comprobanteArchivo) {
            const ivaMonto = montoNeto * (iva / 100);
            const total = montoNeto + ivaMonto;
            const fechaCobroEsperada = new Date(fechaVenta);
            fechaCobroEsperada.setDate(fechaCobroEsperada.getDate() + diasCobro);
            
            const venta = {
                id: generarId(),
                cliente, montoNeto, iva, ivaMonto, total, tipoComprobante, numComprobante,
                fechaVenta, fechaCobroEsperada: fechaCobroEsperada.toISOString().split('T')[0],
                mes: fechaVenta.substring(0, 7),
                estado: 'pendiente_cobro', comprobanteArchivo, registrada: new Date().toISOString()
            };
            db.ventas.push(venta);
            guardarDB();
            return venta;
        }
        
        function registrarCobro(ventaId, fechaCobro, montoCobrado, comprobanteCobro) {
            const venta = db.ventas.find(v => v.id === ventaId);
            if (!venta) return false;
            venta.estado = 'cobrado';
            venta.fechaCobro = fechaCobro;
            venta.montoCobrado = montoCobrado;
            venta.comprobanteCobro = comprobanteCobro;
            const diasDiferencia = Math.ceil((new Date(fechaCobro) - new Date(venta.fechaCobroEsperada)) / (1000 * 60 * 60 * 24));
            venta.diasDiferencia = diasDiferencia;
            venta.estadoPago = diasDiferencia <= 0 ? 'En término' : `Atrasado ${diasDiferencia} días`;
            guardarDB();
            return true;
        }
        
        function registrarCompra(proveedor, montoNeto, iva, tipoComprobante, numComprobante, fechaCompra, diasPago, comprobanteArchivo) {
            const ivaMonto = montoNeto * (iva / 100);
            const total = montoNeto + ivaMonto;
            const fechaPagoEsperada = new Date(fechaCompra);
            fechaPagoEsperada.setDate(fechaPagoEsperada.getDate() + diasPago);
            
            const compra = {
                id: generarId(),
                proveedor, montoNeto, iva, ivaMonto, total, tipoComprobante, numComprobante,
                fechaCompra, fechaPagoEsperada: fechaPagoEsperada.toISOString().split('T')[0],
                mes: fechaCompra.substring(0, 7),
                estado: 'pendiente_pago', comprobanteArchivo, registrada: new Date().toISOString()
            };
            db.compras.push(compra);
            guardarDB();
            return compra;
        }
        
        function registrarPagoCompra(compraId, fechaPago, montoPagado, comprobantePago) {
            const compra = db.compras.find(c => c.id === compraId);
            if (!compra) return false;
            compra.estado = 'pagado';
            compra.fechaPago = fechaPago;
            compra.montoPagado = montoPagado;
            compra.comprobantePago = comprobantePago;
            const diasDiferencia = Math.ceil((new Date(fechaPago) - new Date(compra.fechaPagoEsperada)) / (1000 * 60 * 60 * 24));
            compra.diasDiferencia = diasDiferencia;
            compra.estadoPago = diasDiferencia <= 0 ? 'En término' : `Atrasado ${diasDiferencia} días`;
            guardarDB();
            return true;
        }
        
        // ========== FUNCIONES DE REPORTES MENSUALES ==========
        function obtenerMesesDisponibles() {
            const meses = new Set();
            db.ventas.forEach(v => meses.add(v.mes));
            db.compras.forEach(c => meses.add(c.mes));
            db.costosFijos.forEach(cf => {
                if (cf.vencimiento) meses.add(cf.vencimiento.substring(0, 7));
            });
            return Array.from(meses).sort().reverse();
        }
        
        function calcularReporteMes(mes) {
            const ventasMes = db.ventas.filter(v => v.mes === mes);
            const comprasMes = db.compras.filter(c => c.mes === mes);
            const costosFijosMes = db.costosFijos.filter(cf => cf.vencimiento && cf.vencimiento.substring(0, 7) === mes);
            
            const ventasNetas = ventasMes.reduce((s, v) => s + v.montoNeto, 0);
            const comprasNetas = comprasMes.reduce((s, c) => s + c.montoNeto, 0);
            const ivaCobrado = ventasMes.reduce((s, v) => s + v.ivaMonto, 0);
            const ivaPagado = comprasMes.reduce((s, c) => s + c.ivaMonto, 0);
            const ivaAPagar = ivaCobrado - ivaPagado > 0 ? ivaCobrado - ivaPagado : 0;
            const costosFijosTotal = costosFijosMes.reduce((s, c) => s + c.monto, 0);
            const resultado = ventasNetas - comprasNetas - costosFijosTotal - ivaAPagar;
            const rentabilidad = ventasNetas > 0 ? (resultado / ventasNetas * 100).toFixed(2) : 0;
            
            // Ventas por cobrar del mes
            const ventasPendientes = ventasMes.filter(v => v.estado === 'pendiente_cobro').reduce((s, v) => s + v.total, 0);
            // Compras por pagar del mes
            const comprasPendientes = comprasMes.filter(c => c.estado === 'pendiente_pago').reduce((s, c) => s + c.total, 0);
            
            return {
                mes, ventasNetas, comprasNetas, ivaCobrado, ivaPagado, ivaAPagar, costosFijosTotal,
                resultado, rentabilidad, ventasPendientes, comprasPendientes,
                cantidadVentas: ventasMes.length,
                cantidadCompras: comprasMes.length,
                ventasDetalle: ventasMes,
                comprasDetalle: comprasMes,
                costosDetalle: costosFijosMes
            };
        }
        
        function calcularAcumuladoAnual() {
            const meses = obtenerMesesDisponibles();
            let acumulado = {
                ventasNetas: 0, comprasNetas: 0, ivaCobrado: 0, ivaPagado: 0, costosFijosTotal: 0, resultado: 0
            };
            meses.forEach(mes => {
                const r = calcularReporteMes(mes);
                acumulado.ventasNetas += r.ventasNetas;
                acumulado.comprasNetas += r.comprasNetas;
                acumulado.ivaCobrado += r.ivaCobrado;
                acumulado.ivaPagado += r.ivaPagado;
                acumulado.costosFijosTotal += r.costosFijosTotal;
                acumulado.resultado += r.resultado;
            });
            acumulado.ivaAPagar = acumulado.ivaCobrado - acumulado.ivaPagado > 0 ? acumulado.ivaCobrado - acumulado.ivaPagado : 0;
            acumulado.rentabilidad = acumulado.ventasNetas > 0 ? (acumulado.resultado / acumulado.ventasNetas * 100).toFixed(2) : 0;
            return acumulado;
        }
        
        // ========== DASHBOARD ==========
        function renderDashboard() {
            const meses = obtenerMesesDisponibles();
            const mesActual = meses[0] || new Date().toISOString().substring(0, 7);
            const reporte = mesActual ? calcularReporteMes(mesActual) : null;
            const acumulado = calcularAcumuladoAnual();
            
            return `
                <div class="space-y-4 fade-in pb-24">
                    <h1 class="text-2xl font-bold text-gray-800">📊 Dashboard</h1>
                    
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 rounded-xl">
                        <p class="text-sm">📅 Mes actual: ${mesActual || 'Sin datos'}</p>
                        <p class="text-2xl font-bold">$${formatNumber(reporte?.resultado || 0)}</p>
                        <p class="text-xs">Rentabilidad: ${reporte?.rentabilidad || 0}%</p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-3 rounded-xl shadow"><p class="text-xs text-gray-500">💰 Ventas Netas</p><p class="text-xl font-bold text-green-600">$${formatNumber(reporte?.ventasNetas || 0)}</p></div>
                        <div class="bg-white p-3 rounded-xl shadow"><p class="text-xs text-gray-500">📉 Compras Netas</p><p class="text-xl font-bold text-red-600">$${formatNumber(reporte?.comprasNetas || 0)}</p></div>
                        <div class="bg-white p-3 rounded-xl shadow"><p class="text-xs text-gray-500">💸 Costos Fijos</p><p class="text-xl font-bold text-orange-600">$${formatNumber(reporte?.costosFijosTotal || 0)}</p></div>
                        <div class="bg-white p-3 rounded-xl shadow"><p class="text-xs text-gray-500">🏛️ IVA a Pagar</p><p class="text-xl font-bold text-purple-600">$${formatNumber(reporte?.ivaAPagar || 0)}</p></div>
                    </div>
                    
                    <div class="bg-white p-3 rounded-xl shadow">
                        <h2 class="font-bold text-sm mb-2">📈 Acumulado Anual</h2>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div>Ventas: <span class="font-bold text-green-600">$${formatNumber(acumulado.ventasNetas)}</span></div>
                            <div>Compras: <span class="font-bold text-red-600">$${formatNumber(acumulado.comprasNetas)}</span></div>
                            <div>Ganancia: <span class="font-bold ${acumulado.resultado >= 0 ? 'text-green-600' : 'text-red-600'}">$${formatNumber(acumulado.resultado)}</span></div>
                            <div>Rentabilidad: <span class="font-bold">${acumulado.rentabilidad}%</span></div>
                        </div>
                    </div>
                    
                    <div class="bg-white p-3 rounded-xl shadow">
                        <h2 class="font-bold text-sm mb-2">🔔 Próximos cobros</h2>
                        ${db.ventas.filter(v => v.estado === 'pendiente_cobro').slice(0, 3).map(v => {
                            const dias = calcularDiasRestantes(v.fechaCobroEsperada);
                            return `<div class="flex justify-between text-sm border-b py-1"><span>${v.cliente}</span><span class="${dias < 0 ? 'text-red-600' : 'text-gray-600'}">$${formatNumber(v.total)} - ${dias < 0 ? `Vencido hace ${Math.abs(dias)}` : `Vence en ${dias} días`}</span></div>`;
                        }).join('') || '<p class="text-xs text-gray-400">Sin cobros pendientes</p>'}
                    </div>
                </div>
            `;
        }
        
        // ========== VENTAS ==========
        function renderVentas() {
            const meses = obtenerMesesDisponibles();
            const mesSeleccionado = localStorage.getItem('ventasMesFiltro') || meses[0] || new Date().toISOString().substring(0, 7);
            const ventasFiltradas = db.ventas.filter(v => v.mes === mesSeleccionado);
            const totalMes = ventasFiltradas.reduce((s, v) => s + v.total, 0);
            
            return `
                <div class="space-y-4 fade-in pb-24">
                    <div class="flex justify-between items-center flex-wrap gap-2">
                        <h1 class="text-2xl font-bold">💰 Ventas</h1>
                        <button onclick="modalNuevaVenta()" class="bg-blue-600 text-white px-3 py-1 rounded text-sm">+ Nueva Venta</button>
                    </div>
                    
                    <div class="flex gap-2 items-center">
                        <label class="text-sm font-medium">📅 Mes:</label>
                        <select id="mesSelectVentas" class="p-2 border rounded text-sm flex-1" onchange="filtrarVentasPorMes()">
                            ${meses.map(m => `<option value="${m}" ${m === mesSeleccionado ? 'selected' : ''}>${m}</option>`).join('')}
                        </select>
                    </div>
                    
                    <div class="bg-blue-50 p-3 rounded-xl">
                        <p class="text-sm text-gray-600">Total ventas ${mesSeleccionado}</p>
                        <p class="text-2xl font-bold text-green-600">$${formatNumber(totalMes)}</p>
                    </div>
                    
                    ${ventasFiltradas.map(v => `
                        <div class="bg-white p-3 rounded-xl shadow">
                            <div class="flex justify-between"><div><h3 class="font-bold">${v.cliente}</h3><p class="text-sm">Total: $${formatNumber(v.total)} | ${v.tipoComprobante} ${v.numComprobante}</p><p class="text-xs">Fecha: ${v.fechaVenta} | Cobro esperado: ${v.fechaCobroEsperada}</p><span class="text-xs px-2 rounded ${v.estado === 'cobrado' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${v.estado === 'cobrado' ? '✓ Cobrado' : '⏳ Pendiente'}</span></div>
                            <div>${v.estado === 'pendiente_cobro' ? `<button onclick="modalCobrarVenta(${v.id})" class="bg-green-600 text-white px-2 py-1 rounded text-xs">Registrar Cobro</button>` : v.comprobanteCobro ? `<p class="text-xs text-green-600">Comprobante: ${v.comprobanteCobro}</p>` : ''}</div></div>
                        </div>
                    `).join('') || '<p class="text-center text-gray-500">No hay ventas en este mes</p>'}
                </div>
            `;
        }
        
        window.filtrarVentasPorMes = () => {
            const mes = document.getElementById('mesSelectVentas').value;
            localStorage.setItem('ventasMesFiltro', mes);
            renderVentas();
        };
        
        // ========== COMPRAS ==========
        function renderCompras() {
            const meses = obtenerMesesDisponibles();
            const mesSeleccionado = localStorage.getItem('comprasMesFiltro') || meses[0] || new Date().toISOString().substring(0, 7);
            const comprasFiltradas = db.compras.filter(c => c.mes === mesSeleccionado);
            const totalMes = comprasFiltradas.reduce((s, c) => s + c.total, 0);
            
            return `
                <div class="space-y-4 fade-in pb-24">
                    <div class="flex justify-between"><h1 class="text-2xl font-bold">🛒 Compras</h1><button onclick="modalNuevaCompra()" class="bg-blue-600 text-white px-3 py-1 rounded text-sm">+ Nueva Compra</button></div>
                    <div class="flex gap-2"><label class="text-sm font-medium">📅 Mes:</label><select id="mesSelectCompras" class="p-2 border rounded text-sm flex-1" onchange="filtrarComprasPorMes()">${meses.map(m => `<option value="${m}" ${m === mesSeleccionado ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
                    <div class="bg-red-50 p-3 rounded-xl"><p class="text-sm text-gray-600">Total compras ${mesSeleccionado}</p><p class="text-2xl font-bold text-red-600">$${formatNumber(totalMes)}</p></div>
                    ${comprasFiltradas.map(c => `<div class="bg-white p-3 rounded-xl shadow"><div class="flex justify-between"><div><h3 class="font-bold">${c.proveedor}</h3><p class="text-sm">Total: $${formatNumber(c.total)} | ${c.tipoComprobante} ${c.numComprobante}</p><p class="text-xs">Fecha: ${c.fechaCompra} | Pago esperado: ${c.fechaPagoEsperada}</p><span class="text-xs px-2 rounded ${c.estado === 'pagado' ? 'bg-green-100' : 'bg-yellow-100'}">${c.estado === 'pagado' ? '✓ Pagado' : '⏳ Pendiente'}</span></div><div>${c.estado === 'pendiente_pago' ? `<button onclick="modalPagarCompra(${c.id})" class="bg-green-600 text-white px-2 py-1 rounded text-xs">Pagar</button>` : ''}</div></div></div>`).join('') || '<p class="text-center text-gray-500">No hay compras en este mes</p>'}
                </div>
            `;
        }
        
        window.filtrarComprasPorMes = () => { localStorage.setItem('comprasMesFiltro', document.getElementById('mesSelectCompras').value); renderCompras(); };
        
        // ========== PRESUPUESTOS ==========
        function renderPresupuestos() {
            return `<div class="space-y-4 fade-in pb-24"><div class="flex gap-2"><button onclick="modalNuevoPresupuesto()" class="bg-blue-600 text-white px-3 py-1 rounded text-sm">+ Nuevo Presupuesto</button><button onclick="modalEscanearPresupuesto()" class="bg-green-600 text-white px-3 py-1 rounded text-sm">📷 Escanear</button></div>${db.presupuestos.map(p => `<div class="bg-white p-3 rounded-xl shadow"><div class="flex justify-between"><div><h3 class="font-bold">${p.cliente}</h3><p class="text-sm">Total: $${formatNumber(p.total)}</p><p class="text-xs">${p.fechaCreacion?.split('T')[0]}</p></div><button onclick="verPresupuestoDetalle(${p.id})" class="text-blue-600">Ver</button></div></div>`).join('') || '<p class="text-center text-gray-500">Sin presupuestos</p>'}</div>`;
        }
        
        // ========== REPORTES MENSUALES ==========
        function renderReportes() {
            const meses = obtenerMesesDisponibles();
            const mesSeleccionado = localStorage.getItem('reporteMes') || meses[0] || new Date().toISOString().substring(0, 7);
            const reporte = calcularReporteMes(mesSeleccionado);
            const acumulado = calcularAcumuladoAnual();
            
            return `
                <div class="space-y-4 fade-in pb-24">
                    <h1 class="text-2xl font-bold">📅 Reportes Mensuales</h1>
                    
                    <div class="flex gap-2 items-center">
                        <label class="text-sm font-medium">Seleccionar Mes:</label>
                        <select id="mesSelectReporte" class="p-2 border rounded text-sm flex-1" onchange="cambiarReporteMes()">
                            ${meses.map(m => `<option value="${m}" ${m === mesSeleccionado ? 'selected' : ''}>${m}</option>`).join('')}
                        </select>
                    </div>
                    
                    <!-- Resumen del mes -->
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 rounded-xl">
                        <p class="text-sm">📊 RESULTADO DEL MES</p>
                        <p class="text-3xl font-bold">$${formatNumber(reporte.resultado)}</p>
                        <p class="text-xs">Rentabilidad: ${reporte.rentabilidad}%</p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white p-3 rounded-xl shadow"><p class="text-xs text-gray-500">💰 Ventas Netas</p><p class="text-xl font-bold text-green-600">$${formatNumber(reporte.ventasNetas)}</p><p class="text-xs">${reporte.cantidadVentas} ventas</p></div>
                        <div class="bg-white p-3 rounded-xl shadow"><p class="text-xs text-gray-500">📉 Compras Netas</p><p class="text-xl font-bold text-red-600">$${formatNumber(reporte.comprasNetas)}</p><p class="text-xs">${reporte.cantidadCompras} compras</p></div>
                        <div class="bg-white p-3 rounded-xl shadow"><p class="text-xs text-gray-500">💸 Costos Fijos</p><p class="text-xl font-bold text-orange-600">$${formatNumber(reporte.costosFijosTotal)}</p></div>
                        <div class="bg-white p-3 rounded-xl shadow"><p class="text-xs text-gray-500">🏛️ IVA a Pagar</p><p class="text-xl font-bold text-purple-600">$${formatNumber(reporte.ivaAPagar)}</p></div>
                    </div>
                    
                    <div class="bg-white p-3 rounded-xl shadow">
                        <h2 class="font-bold mb-2">📋 Detalle del Mes</h2>
                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between"><span>IVA Cobrado (ventas)</span><span class="text-green-600">+ $${formatNumber(reporte.ivaCobrado)}</span></div>
                            <div class="flex justify-between"><span>IVA Pagado (compras)</span><span class="text-red-600">- $${formatNumber(reporte.ivaPagado)}</span></div>
                            <div class="flex justify-between"><span>Resultado Operativo</span><span>$${formatNumber(reporte.ventasNetas - reporte.comprasNetas)}</span></div>
                            <div class="border-t pt-1 flex justify-between font-bold"><span>GANANCIA NETA</span><span class="${reporte.resultado >= 0 ? 'text-green-600' : 'text-red-600'}">$${formatNumber(reporte.resultado)}</span></div>
                        </div>
                    </div>
                    
                    <!-- Acumulado anual -->
                    <div class="bg-gray-800 text-white p-4 rounded-xl">
                        <h2 class="font-bold mb-2">📈 ACUMULADO ANUAL</h2>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div>Ventas: <span class="text-green-300">$${formatNumber(acumulado.ventasNetas)}</span></div>
                            <div>Compras: <span class="text-red-300">$${formatNumber(acumulado.comprasNetas)}</span></div>
                            <div>Ganancia: <span class="${acumulado.resultado >= 0 ? 'text-green-300' : 'text-red-300'}">$${formatNumber(acumulado.resultado)}</span></div>
                            <div>Rentabilidad: ${acumulado.rentabilidad}%</div>
                            <div class="col-span-2">IVA Acumulado: <span class="text-yellow-300">$${formatNumber(acumulado.ivaAPagar)}</span></div>
                        </div>
                    </div>
                    
                    <!-- Pendientes -->
                    <div class="bg-yellow-50 p-3 rounded-xl">
                        <p class="font-bold text-sm">⏳ Pendientes de ${mesSeleccionado}</p>
                        <div class="flex justify-between mt-1"><span>Por cobrar:</span><span class="font-bold text-orange-600">$${formatNumber(reporte.ventasPendientes)}</span></div>
                        <div class="flex justify-between"><span>Por pagar:</span><span class="font-bold text-blue-600">$${formatNumber(reporte.comprasPendientes)}</span></div>
                    </div>
                </div>
            `;
        }
        
        window.cambiarReporteMes = () => {
            localStorage.setItem('reporteMes', document.getElementById('mesSelectReporte').value);
            renderReportes();
        };
        
        // ========== CONTADOR ==========
        function renderContador() {
            const meses = obtenerMesesDisponibles();
            const mesActual = meses[0] || new Date().toISOString().substring(0, 7);
            const reporte = calcularReporteMes(mesActual);
            const acumulado = calcularAcumuladoAnual();
            
            return `
                <div class="space-y-4 fade-in pb-24">
                    <h1 class="text-2xl font-bold">🧮 Contador - Argentina</h1>
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 rounded-xl">
                        <p class="text-sm">💰 CAPITAL REAL DISPONIBLE</p>
                        <p class="text-2xl font-bold">$${formatNumber(acumulado.resultado)}</p>
                        <p class="text-xs mt-1">IVA a pagar AFIP: $${formatNumber(acumulado.ivaAPagar)}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow">
                        <h2 class="font-bold">📊 Estado de Resultados ${mesActual}</h2>
                        <div class="space-y-1 text-sm">
                            <div class="flex justify-between"><span>Ventas Netas</span><span class="text-green-600">+ $${formatNumber(reporte.ventasNetas)}</span></div>
                            <div class="flex justify-between"><span>Compras Netas</span><span class="text-red-600">- $${formatNumber(reporte.comprasNetas)}</span></div>
                            <div class="flex justify-between"><span>IVA a Pagar</span><span class="text-orange-600">- $${formatNumber(reporte.ivaAPagar)}</span></div>
                            <div class="flex justify-between"><span>Costos Fijos</span><span class="text-purple-600">- $${formatNumber(reporte.costosFijosTotal)}</span></div>
                            <div class="border-t-2 pt-2 flex justify-between font-bold text-lg"><span>RESULTADO NETO</span><span class="${reporte.resultado >= 0 ? 'text-green-600' : 'text-red-600'}">$${formatNumber(reporte.resultado)}</span></div>
                            <div class="flex justify-between"><span>Rentabilidad Real</span><span class="font-bold">${reporte.rentabilidad}%</span></div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // ========== FUNCIONES MODALES (resumidas) ==========
        function modalNuevaVenta() {
            const clienteOptions = db.clientes.map(c => `<option value="${c.nombre}|${c.diasCobro}">${c.nombre}</option>`).join('');
            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content w-full max-w-md"><h2 class="text-xl font-bold mb-4">💰 Nueva Venta</h2><select id="clienteSelect" class="w-full p-2 border rounded mb-2">${clienteOptions}</select><input type="number" id="montoNeto" placeholder="Monto Neto (sin IVA)" class="w-full p-2 border rounded mb-2"><select id="ivaSelect" class="w-full p-2 border rounded mb-2"><option value="21">IVA 21%</option><option value="10.5">IVA 10.5%</option></select><input type="text" id="numComp" placeholder="Número comprobante" class="w-full p-2 border rounded mb-2"><input type="date" id="fechaVenta" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2 border rounded mb-2"><button onclick="guardarVenta()" class="bg-green-600 text-white p-2 rounded w-full">Guardar</button><button onclick="showView('ventas')" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`;
        }
        
        window.guardarVenta = () => {
            const data = document.getElementById('clienteSelect').value.split('|');
            const cliente = data[0];
            const dias = parseInt(data[1]) || 30;
            const monto = parseFloat(document.getElementById('montoNeto').value);
            const iva = parseFloat(document.getElementById('ivaSelect').value);
            const numComp = document.getElementById('numComp').value;
            const fecha = document.getElementById('fechaVenta').value;
            if (!cliente || isNaN(monto)) { alert("Complete los datos"); return; }
            registrarVenta(cliente, monto, iva, "Factura", numComp, fecha, dias, null);
            alert("✅ Venta registrada");
            showView('ventas');
        };
        
        function modalCobrarVenta(id) { const v = db.ventas.find(x => x.id === id); document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content"><h2 class="text-xl font-bold">💰 Cobrar Venta</h2><p>${v.cliente} - $${formatNumber(v.total)}</p><input type="date" id="fechaCobro" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2 border rounded my-2"><input type="text" id="comprobante" placeholder="Comprobante" class="w-full p-2 border rounded"><button onclick="confirmarCobro(${id})" class="bg-green-600 text-white p-2 rounded w-full">Registrar Cobro</button><button onclick="showView('ventas')" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`; }
        window.confirmarCobro = (id) => { registrarCobro(id, document.getElementById('fechaCobro').value, 0, document.getElementById('comprobante').value); alert("✅ Cobro registrado"); showView('ventas'); };
        
        function modalNuevaCompra() {
            const proveedorOptions = db.proveedores.map(p => `<option value="${p.nombre}|${p.diasPago}">${p.nombre}</option>`).join('');
            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content w-full max-w-md"><h2 class="text-xl font-bold mb-4">🛒 Nueva Compra</h2><select id="proveedorSelect" class="w-full p-2 border rounded mb-2">${proveedorOptions}</select><input type="number" id="montoNeto" placeholder="Monto Neto (sin IVA)" class="w-full p-2 border rounded mb-2"><select id="ivaSelect" class="w-full p-2 border rounded mb-2"><option value="21">IVA 21%</option><option value="10.5">IVA 10.5%</option></select><input type="text" id="numComp" placeholder="Número comprobante" class="w-full p-2 border rounded mb-2"><input type="date" id="fechaCompra" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2 border rounded mb-2"><button onclick="guardarCompra()" class="bg-green-600 text-white p-2 rounded w-full">Guardar</button><button onclick="showView('compras')" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`;
        }
        
        window.guardarCompra = () => {
            const data = document.getElementById('proveedorSelect').value.split('|');
            const proveedor = data[0];
            const dias = parseInt(data[1]) || 30;
            const monto = parseFloat(document.getElementById('montoNeto').value);
            const iva = parseFloat(document.getElementById('ivaSelect').value);
            const numComp = document.getElementById('numComp').value;
            const fecha = document.getElementById('fechaCompra').value;
            if (!proveedor || isNaN(monto)) { alert("Complete los datos"); return; }
            registrarCompra(proveedor, monto, iva, "Factura", numComp, fecha, dias, null);
            alert("✅ Compra registrada");
            showView('compras');
        };
        
        function modalPagarCompra(id) { const c = db.compras.find(x => x.id === id); document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content"><h2 class="text-xl font-bold">💰 Pagar Compra</h2><p>${c.proveedor} - $${formatNumber(c.total)}</p><input type="date" id="fechaPago" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2 border rounded my-2"><input type="text" id="comprobante" placeholder="Comprobante" class="w-full p-2 border rounded"><button onclick="confirmarPago(${id})" class="bg-green-600 text-white p-2 rounded w-full">Registrar Pago</button><button onclick="showView('compras')" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button></div></div>`; }
        window.confirmarPago = (id) => { registrarPagoCompra(id, document.getElementById('fechaPago').value, 0, document.getElementById('comprobante').value); alert("✅ Pago registrado"); showView('compras'); };
        
        // Presupuestos (resumido)
        function modalNuevoPresupuesto() { alert("📝 Función de presupuesto disponible. Usá 'Escanear' para más opciones."); }
        function modalEscanearPresupuesto() { alert("📷 Escaneo de presupuestos disponible. Subí una imagen desde la galería o cámara."); }
        function verPresupuestoDetalle(id) { alert("📄 Detalle del presupuesto"); }
        
        // ========== NAVEGACIÓN ==========
        window.showView = (view) => {
            const views = { dashboard: renderDashboard, ventas: renderVentas, compras: renderCompras, presupuestos: renderPresupuestos, reportes: renderReportes, contador: renderContador };
            document.getElementById('root').innerHTML = views[view]();
        };
        
        showView('dashboard');
    </script>
</body>
</html>
