<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ERP Contable Argentina - Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; max-width: 95%; max-height: 90%; overflow: auto; border-radius: 1rem; padding: 1rem; }
        .btn-camara { background: #2563eb; color: white; padding: 0.75rem; border-radius: 0.5rem; text-align: center; cursor: pointer; }
        .btn-galeria { background: #16a34a; color: white; padding: 0.75rem; border-radius: 0.5rem; text-align: center; cursor: pointer; margin-top: 0.5rem; }
        .notification { position: fixed; top: 10px; right: 10px; z-index: 2000; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body class="bg-gray-50">
    <div id="notificationContainer"></div>
    <div id="root" class="max-w-7xl mx-auto p-4 pb-24"></div>
    
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg z-50">
        <div class="flex justify-around max-w-7xl mx-auto">
            <button onclick="showView('dashboard')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">📊</span><span class="text-xs">Dashboard</span></button>
            <button onclick="showView('ventas')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">💰</span><span class="text-xs">Ventas</span></button>
            <button onclick="showView('compras')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">🛒</span><span class="text-xs">Compras</span></button>
            <button onclick="showView('presupuestos')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">📄</span><span class="text-xs">Presup.</span></button>
            <button onclick="showView('reportes')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">📅</span><span class="text-xs">Reportes</span></button>
            <button onclick="showView('contador')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">🧮</span><span class="text-xs">Contador</span></button>
            <button onclick="showView('configuracion')" class="tab-btn flex flex-col items-center py-2 px-1 text-gray-500"><span class="text-xl">⚙️</span><span class="text-xs">Config</span></button>
        </div>
    </nav>

    <script>
        // ========== BASE DE DATOS COMPLETA ==========
        let db = {
            empresas: JSON.parse(localStorage.getItem('empresas') || '[{"id":1,"nombre":"Mi Empresa SRL","cuit":"30-12345678-9","direccion":"Av. Corrientes 123","telefono":"11-1234-5678","email":"info@miempresa.com","logo":"🏢"}]'),
            empresaActiva: JSON.parse(localStorage.getItem('empresaActiva') || '1'),
            ventas: JSON.parse(localStorage.getItem('ventas') || '[]'),
            compras: JSON.parse(localStorage.getItem('compras') || '[]'),
            presupuestos: JSON.parse(localStorage.getItem('presupuestos') || '[]'),
            clientes: JSON.parse(localStorage.getItem('clientes') || '[]'),
            proveedores: JSON.parse(localStorage.getItem('proveedores') || '[]'),
            costosFijos: JSON.parse(localStorage.getItem('costosFijos') || '[]'),
            pagosHistorial: JSON.parse(localStorage.getItem('pagosHistorial') || '[]'),
            categoriasGastos: JSON.parse(localStorage.getItem('categoriasGastos') || '["Impuestos","Servicios","Alquiler","Sueldos","Bancos"]'),
            notificaciones: JSON.parse(localStorage.getItem('notificaciones') || '[]')
        };
        
        // Datos de ejemplo si está vacío
        if (db.clientes.length === 0) {
            db.clientes = [
                { id: 1, nombre: "Cliente Ejemplo SA", cuit: "30-12345678-9", telefono: "11-1234-5678", email: "cliente@mail.com", direccion: "Av. Santa Fe 123", contacto: "Juan Pérez", diasCobro: 30, saldo: 0 },
                { id: 2, nombre: "Empresa XYZ", cuit: "30-87654321-0", telefono: "11-8765-4321", email: "xyz@mail.com", direccion: "Callao 456", contacto: "María López", diasCobro: 15, saldo: 0 }
            ];
        }
        if (db.proveedores.length === 0) {
            db.proveedores = [
                { id: 1, nombre: "Proveedor Ejemplo", cuit: "30-11111111-1", telefono: "11-1111-1111", email: "proveedor@mail.com", direccion: "Belgrano 789", contacto: "Carlos Gómez", diasPago: 30, saldo: 0 },
                { id: 2, nombre: "Insumos del Oeste", cuit: "30-22222222-2", telefono: "11-2222-2222", email: "insumos@mail.com", direccion: "Rivadavia 101", contacto: "Ana Martínez", diasPago: 45, saldo: 0 }
            ];
        }
        if (db.costosFijos.length === 0) {
            db.costosFijos = [
                { id: 1, nombre: "AFIP - Monotributo", monto: 32000, vencimiento: "2025-05-20", estado: "pendiente", categoria: "Impuestos", recurrente: true },
                { id: 2, nombre: "Alquiler Oficina", monto: 50000, vencimiento: "2025-05-05", estado: "pendiente", categoria: "Alquiler", recurrente: true },
                { id: 3, nombre: "Internet Fibertel", monto: 7200, vencimiento: "2025-05-18", estado: "pendiente", categoria: "Servicios", recurrente: true },
                { id: 4, nombre: "Luz EDENOR", monto: 8500, vencimiento: "2025-05-12", estado: "pendiente", categoria: "Servicios", recurrente: true }
            ];
        }
        
        function guardarDB() {
            localStorage.setItem('empresas', JSON.stringify(db.empresas));
            localStorage.setItem('empresaActiva', JSON.stringify(db.empresaActiva));
            localStorage.setItem('ventas', JSON.stringify(db.ventas));
            localStorage.setItem('compras', JSON.stringify(db.compras));
            localStorage.setItem('presupuestos', JSON.stringify(db.presupuestos));
            localStorage.setItem('clientes', JSON.stringify(db.clientes));
            localStorage.setItem('proveedores', JSON.stringify(db.proveedores));
            localStorage.setItem('costosFijos', JSON.stringify(db.costosFijos));
            localStorage.setItem('pagosHistorial', JSON.stringify(db.pagosHistorial));
            localStorage.setItem('categoriasGastos', JSON.stringify(db.categoriasGastos));
            localStorage.setItem('notificaciones', JSON.stringify(db.notificaciones));
        }
        
        function formatNumber(num) { return num?.toLocaleString('es-AR') || '0'; }
        function generarId() { return Date.now(); }
        function mostrarNotificacion(mensaje, tipo = 'success') {
            const container = document.getElementById('notificationContainer');
            const notif = document.createElement('div');
            notif.className = `notification ${tipo === 'success' ? 'bg-green-500' : tipo === 'error' ? 'bg-red-500' : 'bg-blue-500'} text-white p-3 rounded-lg shadow-lg mb-2`;
            notif.innerHTML = `<div class="flex items-center gap-2"><span>${tipo === 'success' ? '✅' : tipo === 'error' ? '❌' : 'ℹ️'}</span><span>${mensaje}</span></div>`;
            container.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }
        
        function calcularDiasRestantes(fecha) {
            if (!fecha) return null;
            return Math.ceil((new Date(fecha) - new Date()) / (1000 * 60 * 60 * 24));
        }
        
        // Verificar vencimientos y generar notificaciones automáticas
        function verificarVencimientos() {
            const hoy = new Date().toISOString().split('T')[0];
            const nuevasNotificaciones = [];
            
            // Ventas por cobrar vencidas
            db.ventas.filter(v => v.estado === 'pendiente_cobro' && v.fechaCobroEsperada < hoy).forEach(v => {
                nuevasNotificaciones.push({ id: generarId(), tipo: 'cobro', mensaje: `Venta vencida: ${v.cliente} - $${formatNumber(v.total)}`, leida: false, fecha: hoy });
            });
            
            // Compras por pagar vencidas
            db.compras.filter(c => c.estado === 'pendiente_pago' && c.fechaPagoEsperada < hoy).forEach(c => {
                nuevasNotificaciones.push({ id: generarId(), tipo: 'pago', mensaje: `Pago vencido: ${c.proveedor} - $${formatNumber(c.total)}`, leida: false, fecha: hoy });
            });
            
            // Costos fijos vencidos
            db.costosFijos.filter(cf => cf.estado === 'pendiente' && cf.vencimiento < hoy).forEach(cf => {
                nuevasNotificaciones.push({ id: generarId(), tipo: 'costo', mensaje: `Costo fijo vencido: ${cf.nombre} - $${formatNumber(cf.monto)}`, leida: false, fecha: hoy });
            });
            
            nuevasNotificaciones.forEach(n => { if (!db.notificaciones.some(ex => ex.mensaje === n.mensaje && ex.fecha === hoy)) db.notificaciones.unshift(n); });
            guardarDB();
        }
        
        // ========== FUNCIONES DE VENTAS ==========
        function registrarVenta(clienteId, montoNeto, iva, tipoComprobante, numComprobante, fechaVenta, comprobanteArchivo) {
            const cliente = db.clientes.find(c => c.id === clienteId);
            if (!cliente) return null;
            const ivaMonto = montoNeto * (iva / 100);
            const total = montoNeto + ivaMonto;
            const fechaCobroEsperada = new Date(fechaVenta);
            fechaCobroEsperada.setDate(fechaCobroEsperada.getDate() + cliente.diasCobro);
            
            const venta = {
                id: generarId(), clienteId, clienteNombre: cliente.nombre, montoNeto, iva, ivaMonto, total,
                tipoComprobante, numComprobante, fechaVenta, fechaCobroEsperada: fechaCobroEsperada.toISOString().split('T')[0],
                mes: fechaVenta.substring(0, 7), estado: 'pendiente_cobro', comprobanteArchivo, registrada: new Date().toISOString()
            };
            db.ventas.push(venta);
            cliente.saldo = (cliente.saldo || 0) + total;
            guardarDB();
            verificarVencimientos();
            mostrarNotificacion(`✅ Venta registrada a ${cliente.nombre} por $${formatNumber(total)}`);
            return venta;
        }
        
        function registrarCobro(ventaId, fechaCobro, montoCobrado, comprobanteCobro) {
            const venta = db.ventas.find(v => v.id === ventaId);
            if (!venta) return false;
            const cliente = db.clientes.find(c => c.id === venta.clienteId);
            venta.estado = 'cobrado';
            venta.fechaCobro = fechaCobro;
            venta.montoCobrado = montoCobrado;
            venta.comprobanteCobro = comprobanteCobro;
            if (cliente) cliente.saldo = (cliente.saldo || 0) - venta.total;
            const diasDiferencia = Math.ceil((new Date(fechaCobro) - new Date(venta.fechaCobroEsperada)) / (1000 * 60 * 60 * 24));
            venta.diasDiferencia = diasDiferencia;
            venta.estadoPago = diasDiferencia <= 0 ? 'En término' : `Atrasado ${diasDiferencia} días`;
            db.pagosHistorial.unshift({ id: generarId(), tipo: 'cobro', ventaId, monto: montoCobrado, fecha: fechaCobro, comprobante: comprobanteCobro });
            guardarDB();
            mostrarNotificacion(`💰 Cobro registrado de ${venta.clienteNombre} por $${formatNumber(montoCobrado)}`);
            return true;
        }
        
        // ========== FUNCIONES DE COMPRAS ==========
        function registrarCompra(proveedorId, montoNeto, iva, tipoComprobante, numComprobante, fechaCompra, comprobanteArchivo) {
            const proveedor = db.proveedores.find(p => p.id === proveedorId);
            if (!proveedor) return null;
            const ivaMonto = montoNeto * (iva / 100);
            const total = montoNeto + ivaMonto;
            const fechaPagoEsperada = new Date(fechaCompra);
            fechaPagoEsperada.setDate(fechaPagoEsperada.getDate() + proveedor.diasPago);
            
            const compra = {
                id: generarId(), proveedorId, proveedorNombre: proveedor.nombre, montoNeto, iva, ivaMonto, total,
                tipoComprobante, numComprobante, fechaCompra, fechaPagoEsperada: fechaPagoEsperada.toISOString().split('T')[0],
                mes: fechaCompra.substring(0, 7), estado: 'pendiente_pago', comprobanteArchivo, registrada: new Date().toISOString()
            };
            db.compras.push(compra);
            proveedor.saldo = (proveedor.saldo || 0) + total;
            guardarDB();
            verificarVencimientos();
            mostrarNotificacion(`🛒 Compra registrada a ${proveedor.nombre} por $${formatNumber(total)}`);
            return compra;
        }
        
        function registrarPagoCompra(compraId, fechaPago, montoPagado, comprobantePago) {
            const compra = db.compras.find(c => c.id === compraId);
            if (!compra) return false;
            const proveedor = db.proveedores.find(p => p.id === compra.proveedorId);
            compra.estado = 'pagado';
            compra.fechaPago = fechaPago;
            compra.montoPagado = montoPagado;
            compra.comprobantePago = comprobantePago;
            if (proveedor) proveedor.saldo = (proveedor.saldo || 0) - compra.total;
            const diasDiferencia = Math.ceil((new Date(fechaPago) - new Date(compra.fechaPagoEsperada)) / (1000 * 60 * 60 * 24));
            compra.diasDiferencia = diasDiferencia;
            compra.estadoPago = diasDiferencia <= 0 ? 'En término' : `Atrasado ${diasDiferencia} días`;
            db.pagosHistorial.unshift({ id: generarId(), tipo: 'pago', compraId, monto: montoPagado, fecha: fechaPago, comprobante: comprobantePago });
            guardarDB();
            mostrarNotificacion(`💸 Pago registrado a ${compra.proveedorNombre} por $${formatNumber(montoPagado)}`);
            return true;
        }
        
        // ========== COSTOS FIJOS ==========
        function registrarCostoFijo(nombre, monto, vencimiento, categoria, recurrente) {
            const costo = { id: generarId(), nombre, monto, vencimiento, estado: 'pendiente', categoria, recurrente, registrado: new Date().toISOString() };
            db.costosFijos.push(costo);
            guardarDB();
            mostrarNotificacion(`💰 Costo fijo agregado: ${nombre} - $${formatNumber(monto)}`);
            return costo;
        }
        
        function pagarCostoFijo(id, fechaPago, comprobante) {
            const costo = db.costosFijos.find(c => c.id === id);
            if (!costo) return false;
            costo.estado = 'pagado';
            costo.fechaPago = fechaPago;
            costo.comprobante = comprobante;
            db.pagosHistorial.unshift({ id: generarId(), tipo: 'costoFijo', costoId: id, nombre: costo.nombre, monto: costo.monto, fecha: fechaPago, comprobante });
            if (costo.recurrente) {
                const nuevaFecha = new Date(costo.vencimiento);
                nuevaFecha.setMonth(nuevaFecha.getMonth() + 1);
                registrarCostoFijo(costo.nombre, costo.monto, nuevaFecha.toISOString().split('T')[0], costo.categoria, true);
            }
            guardarDB();
            mostrarNotificacion(`✅ Pagado: ${costo.nombre} - $${formatNumber(costo.monto)}`);
            return true;
        }
        
        function eliminarCostoFijo(id) {
            if (confirm("¿Eliminar este costo fijo?")) {
                db.costosFijos = db.costosFijos.filter(c => c.id !== id);
                guardarDB();
                mostrarNotificacion(`🗑️ Costo fijo eliminado`);
                return true;
            }
            return false;
        }
        
        // ========== CLIENTES CRUD ==========
        function agregarCliente(nombre, cuit, telefono, email, direccion, contacto, diasCobro) {
            const cliente = { id: generarId(), nombre, cuit, telefono, email, direccion, contacto, diasCobro: diasCobro || 30, saldo: 0 };
            db.clientes.push(cliente);
            guardarDB();
            mostrarNotificacion(`👤 Cliente agregado: ${nombre}`);
            return cliente;
        }
        
        function editarCliente(id, datos) {
            const cliente = db.clientes.find(c => c.id === id);
            if (cliente) Object.assign(cliente, datos);
            guardarDB();
            mostrarNotificacion(`✏️ Cliente actualizado: ${cliente.nombre}`);
        }
        
        function eliminarCliente(id) {
            if (confirm("¿Eliminar este cliente? Se perderán sus ventas asociadas.")) {
                db.clientes = db.clientes.filter(c => c.id !== id);
                guardarDB();
                mostrarNotificacion(`🗑️ Cliente eliminado`);
            }
        }
        
        // ========== PROVEEDORES CRUD ==========
        function agregarProveedor(nombre, cuit, telefono, email, direccion, contacto, diasPago) {
            const proveedor = { id: generarId(), nombre, cuit, telefono, email, direccion, contacto, diasPago: diasPago || 30, saldo: 0 };
            db.proveedores.push(proveedor);
            guardarDB();
            mostrarNotificacion(`🏭 Proveedor agregado: ${nombre}`);
            return proveedor;
        }
        
        function editarProveedor(id, datos) {
            const proveedor = db.proveedores.find(p => p.id === id);
            if (proveedor) Object.assign(proveedor, datos);
            guardarDB();
            mostrarNotificacion(`✏️ Proveedor actualizado: ${proveedor.nombre}`);
        }
        
        function eliminarProveedor(id) {
            if (confirm("¿Eliminar este proveedor?")) {
                db.proveedores = db.proveedores.filter(p => p.id !== id);
                guardarDB();
                mostrarNotificacion(`🗑️ Proveedor eliminado`);
            }
        }
        
        // ========== CÁLCULOS CONTABLES ==========
        function calcularReporteMes(mes) {
            const ventasMes = db.ventas.filter(v => v.mes === mes);
            const comprasMes = db.compras.filter(c => c.mes === mes);
            const costosFijosMes = db.costosFijos.filter(cf => cf.vencimiento?.substring(0, 7) === mes && cf.estado === 'pagado');
            
            const ventasNetas = ventasMes.reduce((s, v) => s + v.montoNeto, 0);
            const comprasNetas = comprasMes.reduce((s, c) => s + c.montoNeto, 0);
            const ivaCobrado = ventasMes.reduce((s, v) => s + v.ivaMonto, 0);
            const ivaPagado = comprasMes.reduce((s, c) => s + c.ivaMonto, 0);
            const ivaAPagar = ivaCobrado - ivaPagado > 0 ? ivaCobrado - ivaPagado : 0;
            const costosFijosTotal = costosFijosMes.reduce((s, c) => s + c.monto, 0);
            const resultado = ventasNetas - comprasNetas - costosFijosTotal - ivaAPagar;
            const rentabilidad = ventasNetas > 0 ? (resultado / ventasNetas * 100).toFixed(2) : 0;
            
            return { mes, ventasNetas, comprasNetas, ivaCobrado, ivaPagado, ivaAPagar, costosFijosTotal, resultado, rentabilidad, cantidadVentas: ventasMes.length, cantidadCompras: comprasMes.length };
        }
        
        function calcularAcumuladoAnual() {
            const meses = [...new Set([...db.ventas.map(v => v.mes), ...db.compras.map(c => c.mes)])].sort();
            let acumulado = { ventasNetas: 0, comprasNetas: 0, ivaCobrado: 0, ivaPagado: 0, costosFijosTotal: 0, resultado: 0 };
            meses.forEach(m => { const r = calcularReporteMes(m); acumulado.ventasNetas += r.ventasNetas; acumulado.comprasNetas += r.comprasNetas; acumulado.ivaCobrado += r.ivaCobrado; acumulado.ivaPagado += r.ivaPagado; acumulado.costosFijosTotal += r.costosFijosTotal; acumulado.resultado += r.resultado; });
            acumulado.ivaAPagar = acumulado.ivaCobrado - acumulado.ivaPagado > 0 ? acumulado.ivaCobrado - acumulado.ivaPagado : 0;
            acumulado.rentabilidad = acumulado.ventasNetas > 0 ? (acumulado.resultado / acumulado.ventasNetas * 100).toFixed(2) : 0;
            return acumulado;
        }
        
        // ========== EXPORTAR A PDF ==========
        function exportarReportePDF(mes) {
            const reporte = calcularReporteMes(mes);
            const empresa = db.empresas.find(e => e.id === db.empresaActiva) || db.empresas[0];
            const content = `
                <div style="font-family: Arial, sans-serif; padding: 20px;">
                    <h1 style="color: #2563eb;">${empresa.nombre}</h1>
                    <p>CUIT: ${empresa.cuit} | Tel: ${empresa.telefono} | Email: ${empresa.email}</p>
                    <hr>
                    <h2>📊 Reporte Mensual - ${mes}</h2>
                    <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                        <tr><td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>Ventas Netas</strong></td><td style="padding: 8px; border-bottom: 1px solid #ddd;">$${formatNumber(reporte.ventasNetas)}</td></tr>
                        <tr><td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>Compras Netas</strong></td><td style="padding: 8px; border-bottom: 1px solid #ddd;">$${formatNumber(reporte.comprasNetas)}</td></tr>
                        <tr><td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>IVA a Pagar</strong></td><td style="padding: 8px; border-bottom: 1px solid #ddd;">$${formatNumber(reporte.ivaAPagar)}</td></tr>
                        <tr><td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>Costos Fijos</strong></td><td style="padding: 8px; border-bottom: 1px solid #ddd;">$${formatNumber(reporte.costosFijosTotal)}</td></tr>
                        <tr><td style="padding: 8px; border-bottom: 2px solid #000;"><strong>RESULTADO NETO</strong></td><td style="padding: 8px; border-bottom: 2px solid #000;"><strong>$${formatNumber(reporte.resultado)}</strong></td></tr>
                        <tr><td style="padding: 8px;"><strong>Rentabilidad</strong></td><td style="padding: 8px;">${reporte.rentabilidad}%</td></tr>
                    </table>
                    <hr>
                    <p style="font-size: 12px; color: #666; margin-top: 20px;">Reporte generado el ${new Date().toLocaleDateString()}</p>
                </div>
            `;
            html2pdf().set({ margin: 1, filename: `reporte_${mes}.pdf` }).from(content).save();
            mostrarNotificacion(`📄 Reporte PDF generado para ${mes}`);
        }
        
        function exportarPresupuestoPDF(presupuesto) {
            const empresa = db.empresas.find(e => e.id === db.empresaActiva) || db.empresas[0];
            const content = `
                <div style="font-family: Arial, sans-serif; padding: 20px;">
                    <h1 style="color: #2563eb;">${empresa.nombre}</h1>
                    <p>CUIT: ${empresa.cuit} | Tel: ${empresa.telefono} | Email: ${empresa.email}</p>
                    <hr>

        };

        window.verHistorialCliente = (id) => {
            const cliente = db.clientes.find(c => c.id === id);
            const ventas = db.ventas.filter(v => v.clienteId === id);
            mostrarNotificacion(`${cliente.nombre}: ${ventas.length} ventas - Saldo: $${formatNumber(cliente.saldo)}`);
        };

            const proveedor = db.proveedores.find(p => p.id === id);

        };
        window.limpiarNotificaciones = () => { db.notificaciones = []; guardarDB(); renderConfiguracion(); mostrarNotificacion("Notificaciones limpiadas"); };
        window.cambiarEmpresaActiva = (id) => { db.empresaActiva = id; guardarDB(); renderConfiguracion(); mostrarNotificacion("Empresa cambiada"); };
        
        // Presupuestos OCR
        let itemsPresupuestoOCR = [];
        function mostrarModalEscanearPresupuesto() {
            document.getElementById('root').innerHTML = `
                <div class="modal"><div class="modal-content w-full max-w-md">
                    <h2 class="text-xl font-bold mb-4">📷 Escanear Presupuesto</h2>
                    <input type="file" id="fileInput" accept="image/*" capture="environment" class="w-full p-2 border rounded mb-2">
                    <button onclick="abrirCamara()" class="btn-camara w-full mb-2">📸 Usar cámara</button>
                    <div id="ocrProgress" class="hidden text-blue-600 text-center">Procesando OCR...</div>
                    <div id="ocrPreview" class="mt-2 text-center"></div>
                    <div id="itemsDetectados" class="mt-2 max-h-60 overflow-y-auto"></div>
                    <button id="aceptarOCR" class="hidden bg-green-600 text-white p-2 rounded w-full mt-2">Aceptar y editar</button>
                    <button onclick="cancelarModal()" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button>
                </div></div>`;
            
            window.abrirCamara = () => { document.getElementById('fileInput').click(); };
            const fileInput = document.getElementById('fileInput');
            fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const progress = document.getElementById('ocrProgress');
                progress.classList.remove('hidden');
                try {
                    const { data: { text } } = await Tesseract.recognize(file, 'spa');
                    const nums = text.match(/\d{2,6}[.,]?\d{0,2}/g) || [];
                    const precios = nums.filter(n => { const num = parseFloat(n.replace(',', '.')); return num > 100 && num < 10000000; }).slice(0, 8);
                    if (precios.length > 0) {
                        itemsPresupuestoOCR = precios.map(p => ({ desc: "Item detectado", cant: 1, costo: parseFloat(p.replace(',', '.')) }));
                        const itemsDiv = document.getElementById('itemsDetectados');
                        itemsDiv.innerHTML = `<p class="font-bold">✅ ${precios.length} items detectados:</p>` + itemsPresupuestoOCR.map(i => `<div class="flex gap-2 items-center my-1"><input value="${i.desc}" class="itemDesc flex-1 border p-1 rounded"><input type="number" value="${i.cant}" class="itemCant w-16 border p-1 rounded"><input type="number" value="${i.costo}" class="itemCosto w-24 border p-1 rounded"></div>`).join('');
                        document.getElementById('aceptarOCR').classList.remove('hidden');
                    } else { alert("No se detectaron precios"); }
                } catch(err) { alert("Error OCR"); }
                finally { progress.classList.add('hidden'); }
            };
            document.getElementById('aceptarOCR').onclick = () => {
                const items = [];
                document.querySelectorAll('#itemsDetectados .itemDesc').forEach((el, i) => {
                    items.push({ desc: el.value, cant: parseFloat(document.querySelectorAll('.itemCant')[i].value) || 1, costo: parseFloat(document.querySelectorAll('.itemCosto')[i].value) || 0 });
                });
                mostrarModalNuevoPresupuestoConItems(items);
            };
        }
        
        function mostrarModalNuevoPresupuesto() { mostrarModalNuevoPresupuestoConItems([]); }
        function mostrarModalNuevoPresupuestoConItems(itemsIniciales) {
            const clientesOptions = db.clientes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
            document.getElementById('root').innerHTML = `
                <div class="modal"><div class="modal-content w-full max-w-2xl">
                    <h2 class="text-xl font-bold mb-4">📄 Nuevo Presupuesto</h2>
                    <select id="clienteId" class="w-full p-2 border rounded mb-2"><option value="">Seleccionar cliente...</option>${clientesOptions}</select>
                    <div id="itemsContainer">${(itemsIniciales.length ? itemsIniciales : [{ desc: "", cant: 1, costo: 0 }]).map((it, idx) => `<div class="flex gap-2 mb-1"><input placeholder="Producto" value="${it.desc}" class="itemDesc flex-1 border p-1 rounded"><input type="number" placeholder="Cant" value="${it.cant}" class="itemCant w-20 border p-1 rounded"><input type="number" placeholder="Precio" value="${it.costo}" class="itemPrecio w-28 border p-1 rounded"><button onclick="this.parentElement.remove()" class="text-red-500">🗑️</button></div>`).join('')}</div>
                    <button onclick="agregarItemPresupuestoUI()" class="bg-gray-200 p-1 rounded text-sm mb-2">+ Agregar item</button>
                    <div class="mb-2"><label>Margen: <span id="margenSpan">30</span>%</label><input type="range" id="margenSlider" min="0" max="200" value="30" class="w-full"></div>
                    <div id="totalPresupuesto" class="text-right font-bold text-lg mb-2">Total: $0</div>
                    <button onclick="guardarPresupuestoUI()" class="bg-green-600 text-white p-2 rounded w-full">Guardar Presupuesto</button>
                    <button onclick="cancelarModal()" class="bg-gray-300 p-2 rounded w-full mt-1">Cancelar</button>
                </div></div>`;
            actualizarTotalPresupuestoUI();
            document.getElementById('margenSlider').oninput = (e) => { document.getElementById('margenSpan').innerText = e.target.value; actualizarTotalPresupuestoUI(); };
        }
        
        window.agregarItemPresupuestoUI = () => {
            const container = document.getElementById('itemsContainer');
            const div = document.createElement('div');
            div.className = 'flex gap-2 mb-1';
            div.innerHTML = `<input placeholder="Producto" class="itemDesc flex-1 border p-1 rounded"><input type="number" placeholder="Cant" value="1" class="itemCant w-20 border p-1 rounded"><input type="number" placeholder="Precio" class="itemPrecio w-28 border p-1 rounded"><button onclick="this.parentElement.remove();actualizarTotalPresupuestoUI()" class="text-red-500">🗑️</button>`;
            container.appendChild(div);
            div.querySelectorAll('input').forEach(i => i.addEventListener('input', () => actualizarTotalPresupuestoUI()));
        };
        
        function actualizarTotalPresupuestoUI() {
            let total = 0;
            const markup = parseInt(document.getElementById('margenSlider')?.value || 30) / 100;
            document.querySelectorAll('#itemsContainer .itemPrecio').forEach((p, i) => {
                const cant = parseFloat(document.querySelectorAll('.itemCant')[i]?.value || 1);
                const precio = parseFloat(p.value || 0);
                total += precio * (1 + markup) * cant;
            });
            const totalEl = document.getElementById('totalPresupuesto');
            if (totalEl) totalEl.innerText = `Total: $${formatNumber(total)}`;
        }
        
        window.guardarPresupuestoUI = () => {
            const clienteId = parseInt(document.getElementById('clienteId').value);
            const cliente = db.clientes.find(c => c.id === clienteId);
            if (!cliente) { mostrarNotificacion("Seleccione un cliente", 'error'); return; }
            const items = [];
            document.querySelectorAll('#itemsContainer .itemDesc').forEach((d, i) => {
                const desc = d.value;
                const cant = parseFloat(document.querySelectorAll('.itemCant')[i]?.value || 1);
                const precio = parseFloat(document.querySelectorAll('.itemPrecio')[i]?.value || 0);
                if (desc && precio > 0) items.push({ desc, cant, costo: precio });
            });
            if (items.length === 0) { mostrarNotificacion("Agregue al menos un item", 'error'); return; }
            const markup = parseInt(document.getElementById('margenSlider').value) / 100;
            const total = items.reduce((s, i) => s + i.costo * (1 + markup) * i.cant, 0);
            db.presupuestos.push({ id: generarId(), clienteId, cliente: cliente.nombre, items, markup: markup * 100, total, fechaCreacion: new Date().toISOString(), estado: 'borrador' });
            guardarDB();
            mostrarNotificacion(`✅ Presupuesto guardado para ${cliente.nombre} por $${formatNumber(total)}`);
            cancelarModal();
            showView('presupuestos');
        };
        
        // ========== NAVEGACIÓN ==========
        let currentView = 'dashboard';
        window.showView = (view) => {
            currentView = view;
            const views = { dashboard: renderDashboard, ventas: renderVentas, compras: renderCompras, presupuestos: renderPresupuestos, reportes: renderReportes, contador: renderContador, configuracion: renderConfiguracion };
            document.getElementById('root').innerHTML = views[view]();
        };
        
        verificarVencimientos();
        showView('dashboard');
    </script>
