    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f3f4f6; }
        #app { height: 100%; display: flex; flex-direction: column; }
        #root { flex: 1; overflow-y: auto; padding: 1rem; padding-top: 4.5rem; padding-bottom: 90px; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); padding: 1rem; animation: fadeIn 0.2s ease; }
        .modal-content { background: white; border-radius: 1.5rem; padding: 1.5rem; max-width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); width: 100%; }
        .dark .modal-content { background: #1f2937; color: #e5e7eb; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.1rem; font-size: 0.7rem; padding: 0.4rem 0.3rem; border-radius: 0.75rem; transition: all 0.2s; min-width: 50px; color: #6b7280; background: transparent; border: none; cursor: pointer; }
        .nav-btn.active { color: #2563eb; background: #eff6ff; }
        .dark .nav-btn.active { color: #60a5fa; background: #1e3a8a; }
        .nav-btn span:first-child { font-size: 1.5rem; }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        .dark ::-webkit-scrollbar-track { background: #374151; }
        .dark ::-webkit-scrollbar-thumb { background: #6b7280; }
        /* Notificaciones */
        #notificacionesContador { min-width: 20px; min-height: 20px; line-height: 20px; font-size: 11px; }
    </style>
</head>
<body>
    <div id="app" class="dark:bg-gray-900 dark:text-gray-100">
        <!-- Banner de instalación PWA -->
        <div id="installBanner" class="fixed top-0 left-0 right-0 z-50 bg-blue-600 text-white p-3 flex justify-between items-center shadow-lg transform -translate-y-full transition-transform duration-500">
            <span class="text-sm font-medium">📱 Instalá la app en tu dispositivo</span>
            <div class="flex gap-2">
                <button id="installApp" class="bg-white text-blue-600 px-4 py-1 rounded-lg text-sm font-bold">Instalar</button>
                <button id="closeBanner" class="text-white/80 hover:text-white text-xl">&times;</button>
            </div>
        </div>

        <!-- Barra superior fija con fecha/hora y iconos -->
        <div class="fixed top-0 left-0 right-0 z-40 bg-white dark:bg-gray-800 border-b dark:border-gray-700 px-2 sm:px-4 py-2 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-2 flex-shrink-0">
                <span class="text-2xl">📊</span>
                <span class="font-bold text-gray-800 dark:text-white hidden sm:inline">ERP Contable</span>
                <span id="empresaActivaBadge" class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full hidden" title="Empresa activa"></span>
            </div>

            <!-- 🔥 v7.16.9: Fecha/Mes/Hora en la cabecera -->

            <div id="fechaHoraDesktop" class="hidden md:flex flex-col items-center flex-1 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg px-3 py-1 transition-colors" onclick="window.abrirModalFechaHora()" title="Click para ver más">
                <div id="fechaHoraMes" class="text-sm font-bold text-gray-700 dark:text-gray-200">—</div>
                <div id="fechaHoraDetalle" class="text-xs text-gray-500 dark:text-gray-400">—</div>
            </div>
            <!-- Móvil: solo mes, click para detalle -->
            <div id="fechaHoraMobile" class="md:hidden flex flex-col items-center flex-1 cursor-pointer" onclick="window.abrirModalFechaHora()">

            </div>

            <div class="flex items-center gap-0.5 sm:gap-1 flex-shrink-0">
                <button id="empresasBtn" onclick="window.showView('empresas')" class="p-1.5 sm:p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors hidden" title="Gestión de empresas (super-admin)">
                    <span class="text-xl sm:text-2xl">🏢</span>
                </button>
                <button id="usuariosBtn" onclick="window.showView('usuarios')" class="p-1.5 sm:p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors hidden" title="Gestión de usuarios (super-admin)">
                    <span class="text-xl sm:text-2xl">🎭</span>
                </button>
                <button id="notificacionesBtn" onclick="window.mostrarNotificacionesPopup()" class="relative p-1.5 sm:p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                    <span class="text-xl sm:text-2xl">🔔</span>
                    <span id="notificacionesContador" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
                </button>
                <button id="darkModeBtn" class="p-1.5 sm:p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                    <span class="text-xl sm:text-2xl">🌙</span>
                </button>
                <button id="cerrarSesionBtn" onclick="if(confirm('¿Cerrar sesión?')) window.cerrarSesion()" class="p-1.5 sm:p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" title="Cerrar sesión">
                    <span class="text-xl sm:text-2xl">🚪</span>
                </button>
            </div>
        </div>

        <!-- Contenedor principal -->
        <div id="root" class="pb-24"></div>

        <!-- Barra de navegación inferior -->

            <button data-view="dashboard" class="nav-btn active"><span>📊</span><span>Dashboard</span></button>
            <button data-view="ventas" class="nav-btn"><span>💰</span><span>Ventas</span></button>

            <button data-view="contador" class="nav-btn"><span>🧮</span><span>Contador</span></button>

            <button data-view="configuracion" class="nav-btn"><span>⚙️</span><span>Config.</span></button>
        </div>

            <!-- 🔥 Auto-actualización del Service Worker (v7.16.34 - MANUAL) -->
    <script>
    (function() {
        if (!('serviceWorker' in navigator)) return;

        let recargando = false;

        // Cuando el SW nuevo toma control, NO recargar automáticamente.
        // En su lugar, mostrar un banner pidiendo al usuario que recargue manualmente.
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            console.log('[App] SW nuevo activo. Usá Ctrl+Shift+R para recargar.');
        });

        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('[App] SW registrado. Scope:', reg.scope);

                reg.addEventListener('updatefound', () => {
                    const newWorker = reg.installing;
                    if (!newWorker) return;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            console.log('[App] Nueva versión lista. Activando...');
                            newWorker.postMessage({ type: 'SKIP_WAITING' });
                            mostrarBannerActualizacion();
                        }
                    });
                });
            }).catch(err => {
                console.warn('[App] Error registrando SW:', err);
            });
        });

        function mostrarBannerActualizacion() {
            // Si ya hay un banner, no crear otro
            if (document.getElementById('bannerActualizacion')) return;

            const banner = document.createElement('div');
            banner.id = 'bannerActualizacion';
            banner.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:9999;background:#1e40af;color:white;padding:12px 20px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.3);font-family:system-ui;display:flex;align-items:center;gap:12px;';
            banner.innerHTML = `
                <span style="font-size:1.2rem;">🔄</span>
                <span style="font-size:0.9rem;">Hay una actualización disponible</span>
                <button id="btnRecargarApp" style="background:white;color:#1e40af;border:none;padding:6px 14px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:0.9rem;">Actualizar</button>
                <button id="btnCerrarBanner" style="background:transparent;color:white;border:none;font-size:1.2rem;cursor:pointer;padding:0 4px;">&times;</button>
            `;
            document.body.appendChild(banner);

            document.getElementById('btnRecargarApp').onclick = () => {
                window.location.reload();
            };
            document.getElementById('btnCerrarBanner').onclick = () => {
                banner.remove();
            };
        }
    })();
    </script>

    <!-- Script principal -->
