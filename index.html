<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MiERP">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://emojicdn.elk.sh/📊?size=192">
    <title>ERP Contable Argentina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50">
    <div id="notificationContainer"></div>
    <div id="root" class="max-w-7xl mx-auto p-4 pb-24"></div>
    
    <!-- Botón modo oscuro flotante -->
    <button id="darkModeBtn" class="fixed bottom-24 right-4 bg-gray-800 dark:bg-gray-700 text-white p-3 rounded-full shadow-lg z-50 hover:scale-110 transition-transform">
        🌓
    </button>
    
    <!-- Barra de navegación -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-900 border-t dark:border-gray-700 shadow-lg z-50">
        <div class="flex justify-around max-w-7xl mx-auto">
            <button data-view="dashboard" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">📊</span><span class="text-xs font-medium mt-1">Dashboard</span>
            </button>
            <button data-view="ventas" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">💰</span><span class="text-xs font-medium mt-1">Ventas</span>
            </button>
            <button data-view="compras" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">🛒</span><span class="text-xs font-medium mt-1">Compras</span>
            </button>
            <button data-view="presupuestos" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">📄</span><span class="text-xs font-medium mt-1">Presup.</span>
            </button>
            <button data-view="reportes" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">📅</span><span class="text-xs font-medium mt-1">Reportes</span>
            </button>
            <button data-view="contador" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">🧮</span><span class="text-xs font-medium mt-1">Contador</span>
            </button>
            <button data-view="configuracion" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">⚙️</span><span class="text-xs font-medium mt-1">Config</span>
            </button>
        </div>
    </nav>

    <script type="module" src="app.js"></script>
    
    <!-- Banner de instalación PWA -->
    <div id="installBanner" class="fixed top-0 left-0 right-0 bg-blue-600 text-white p-3 shadow-lg z-50 transform transition-transform duration-300 -translate-y-full">
        <div class="flex justify-between items-center max-w-7xl mx-auto">
            <div class="flex items-center gap-3">
                <span class="text-2xl">📊</span>
                <div><p class="font-bold">Instalar ERP Contable</p><p class="text-xs text-blue-100">Usala como app nativa</p></div>
            </div>
            <div class="flex gap-2">
                <button id="installApp" class="bg-white text-blue-600 px-4 py-1 rounded font-semibold text-sm">Instalar</button>
                <button id="closeBanner" class="text-white px-2 text-xl">✕</button>
            </div>
        </div>
    </div>
</body>
</html>
