<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ERP Contable Argentina - Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; max-width: 95%; max-height: 90%; overflow: auto; border-radius: 1.5rem; padding: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .notification { position: fixed; top: 20px; right: 20px; z-index: 2000; animation: slideIn 0.3s ease; border-radius: 1rem; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .dark { background-color: #0f172a; color: #f1f5f9; }
        .dark .bg-white { background-color: #1e293b; }
        .dark .bg-gray-50 { background-color: #0f172a; }
        .dark .bg-gray-100 { background-color: #334155; }
        .dark .text-gray-800 { color: #f1f5f9; }
        .dark .text-gray-500, .dark .text-gray-600 { color: #94a3b8; }
        .dark .border { border-color: #334155; }
        .chart-container { position: relative; height: 250px; width: 100%; }
        .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .dark .glass-card { background: rgba(30,41,59,0.95); }
        .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #06b6d4 100%); }
        .gradient-success { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
        .gradient-danger { background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%); }
        .gradient-warning { background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%); }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -12px rgba(0,0,0,0.15); }
    </style>
</head>
<body class="bg-gray-50">
    <div id="notificationContainer"></div>
    <div id="root" class="max-w-7xl mx-auto p-4 pb-24"></div>
    
    <!-- Botón modo oscuro flotante -->
    <button onclick="toggleDarkMode()" class="fixed bottom-24 right-4 bg-gray-800 dark:bg-gray-700 text-white p-3 rounded-full shadow-lg z-50 hover:scale-110 transition-transform">
        🌓
    </button>
    
    <!-- Barra de navegación mejorada -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-900 border-t dark:border-gray-700 shadow-lg z-50">
        <div class="flex justify-around max-w-7xl mx-auto">
            <button onclick="showView('dashboard')" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">📊</span>
                <span class="text-xs font-medium mt-1">Dashboard</span>
            </button>
            <button onclick="showView('ventas')" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">💰</span>
                <span class="text-xs font-medium mt-1">Ventas</span>
            </button>
            <button onclick="showView('compras')" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">🛒</span>
                <span class="text-xs font-medium mt-1">Compras</span>
            </button>
            <button onclick="showView('presupuestos')" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">📄</span>
                <span class="text-xs font-medium mt-1">Presup.</span>
            </button>
            <button onclick="showView('reportes')" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">📅</span>
                <span class="text-xs font-medium mt-1">Reportes</span>
            </button>
            <button onclick="showView('contador')" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">🧮</span>
                <span class="text-xs font-medium mt-1">Contador</span>
            </button>
            <button onclick="showView('configuracion')" class="nav-btn flex flex-col items-center py-3 px-2 text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-all duration-200">
                <span class="text-2xl">⚙️</span>
                <span class="text-xs font-medium mt-1">Config</span>
            </button>
        </div>
    </nav>

    <script>
        // ========== BASE DE DATOS ==========
        let db = {
            empresas: JSON.parse(localStorage.getItem('empresas') || '[{"id":1,"nombre":"Mi Empresa SRL","cuit":"30-12345678-9","direccion":"Av. Corrientes 123","telefono":"11-1234-5678","email":"info@miempresa.com","logo":"🏢","whatsapp":"5491112345678","cbu":"1234567890123456789012"}]'),
            empresaActiva: JSON.parse(localStorage.getItem('empresaActiva') || '1'),
            ventas: JSON.parse(localStorage.getItem('ventas') || '[]'),
            compras: JSON.parse(localStorage.getItem('compras') || '[]'),
            presupuestos: JSON.parse(localStorage.getItem('presupuestos') || '[]'),
            clientes: JSON.parse(localStorage.getItem('clientes') || '[]'),
            proveedores: JSON.parse(localStorage.getItem('proveedores') || '[]'),
            costosFijos: JSON.parse(localStorage.getItem('costosFijos') || '[]'),
            pagosHistorial: JSON.parse(localStorage.getItem('pagosHistorial') || '[]'),
            categoriasGastos: JSON.parse(localStorage.getItem('categoriasGastos') || '["Impuestos","Servicios","Alquiler","Sueldos","Bancos"]'),
            notificaciones: JSON.parse(localStorage.getItem('notificaciones') || '[]'),
            proximoNumPresupuesto: JSON.parse(localStorage.getItem('proximoNumPresupuesto') || '1001')
        };
        
        let darkMode = localStorage.getItem('darkMode') === 'true';
        let chartInstance = null;
        
        if (db.clientes.length === 0) {
            db.clientes = [
                { id: 1, nombre: "Cliente Ejemplo SA", cuit: "30-12345678-9", telefono: "11-1234-5678", email: "cliente@mail.com", direccion: "Av. Santa Fe 123", contacto: "Juan Pérez", diasCobro: 30, saldo: 0, whatsapp: "5491112345678", cbu: "1234567890123456789012" },
                { id: 2, nombre: "Empresa XYZ", cuit: "30-87654321-0", telefono: "11-8765-4321", email: "xyz@mail.com", direccion: "Callao 456", contacto: "María López", diasCobro: 15, saldo: 0, whatsapp: "5491187654321", cbu: "9876543210987654321098" }
            ];
        }
        if (db.proveedores.length === 0) {
            db.proveedores = [
                { id: 1, nombre: "Proveedor Ejemplo", cuit: "30-11111111-1", telefono: "11-1111-1111", email: "proveedor@mail.com", direccion: "Belgrano 789", contacto: "Carlos Gómez", diasPago: 30, saldo: 0, cbu: "1111111111111111111111", rubro: "Insumos" },
                { id: 2, nombre: "Insumos del Oeste", cuit: "30-22222222-2", telefono: "11-2222-2222", email: "insumos@mail.com", direccion: "Rivadavia 101", contacto: "Ana Martínez", diasPago: 45, saldo: 0, cbu: "2222222222222222222222", rubro: "Materia prima" }
            ];
        }
        if (db.costosFijos.length === 0) {
            db.costosFijos = [
                { id: 1, nombre: "AFIP - Monotributo", monto: 32000, vencimiento: "2025-05-20", estado: "pendiente", categoria: "Impuestos", recurrente: true },
                { id: 2, nombre: "Alquiler Oficina", monto: 50000, vencimiento: "2025-05-05", estado: "pendiente", categoria: "Alquiler", recurrente: true }
            ];
        }
        
        guardarDB();
        
        function guardarDB() {
            localStorage.setItem('empresas', JSON.stringify(db.empresas));
            localStorage.setItem('empresaActiva', JSON.stringify(db.empresaActiva));
            localStorage.setItem('ventas', JSON.stringify(db.ventas));
            localStorage.setItem('compras', JSON.stringify(db.compras));
            localStorage.setItem('presupuestos', JSON.stringify(db.presupuestos));
            localStorage.setItem('clientes', JSON.stringify(db.clientes));
            localStorage.setItem('proveedores', JSON.stringify(db.proveedores));
            localStorage.setItem('costosFijos', JSON.stringify(db.costosFijos));
            localStorage.setItem('pagosHistorial', JSON.stringify(db.pagosHistorial));
            localStorage.setItem('categoriasGastos', JSON.stringify(db.categoriasGastos));
            localStorage.setItem('notificaciones', JSON.stringify(db.notificaciones));
            localStorage.setItem('proximoNumPresupuesto', JSON.stringify(db.proximoNumPresupuesto));
        }
        
        function formatNumber(num) { return num?.toLocaleString('es-AR') || '0'; }
        function generarId() { return Date.now(); }
        
        function mostrarNotificacion(mensaje, tipo = 'success') {
            const container = document.getElementById('notificationContainer');
            const notif = document.createElement('div');
            let bgColor = 'bg-green-500';
            let icono = '✅';
            if (tipo === 'error') { bgColor = 'bg-red-500'; icono = '❌'; }
            else if (tipo === 'warning') { bgColor = 'bg-yellow-500'; icono = '⚠️'; }
            else if (tipo === 'info') { bgColor = 'bg-blue-500'; icono = 'ℹ️'; }
            notif.className = `notification ${bgColor} text-white px-4 py-3 rounded-xl shadow-lg mb-3 flex items-center gap-3`;
            notif.innerHTML = `<span class="text-xl">${icono}</span><span class="font-medium">${mensaje}</span>`;
            container.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }
        
        function toggleDarkMode() {
            darkMode = !darkMode;
            localStorage.setItem('darkMode', darkMode);
            if (darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            showView(currentView);
        }
        
        function calcularDiasRestantes(fecha) {
            if (!fecha) return null;
            return Math.ceil((new Date(fecha) - new Date()) / (1000 * 60 * 60 * 24));
        }
        
        // ========== FUNCIONES PRINCIPALES ==========
        function agregarCliente(datos) {
            const cliente = { id: generarId(), ...datos, saldo: 0 };
            db.clientes.push(cliente);
            guardarDB();
            mostrarNotificacion(`👤 Cliente agregado: ${cliente.nombre}`, 'success');
            return cliente;
        }
        
        function editarCliente(id, datos) {
            const index = db.clientes.findIndex(c => c.id === id);
            if (index !== -1) {
                db.clientes[index] = { ...db.clientes[index], ...datos };
                guardarDB();
                mostrarNotificacion(`✏️ Cliente actualizado: ${db.clientes[index].nombre}`, 'success');
                return true;
            }
            return false;
        }
        
        function eliminarCliente(id) {
            if (confirm("⚠️ ¿Eliminar este cliente? Se perderán sus datos.")) {
                db.clientes = db.clientes.filter(c => c.id !== id);
                guardarDB();
                mostrarNotificacion("🗑️ Cliente eliminado", 'info');
                renderConfiguracion();
            }
        }
        
        function agregarProveedor(datos) {
            const proveedor = { id: generarId(), ...datos, saldo: 0 };
            db.proveedores.push(proveedor);
            guardarDB();
            mostrarNotificacion(`🏭 Proveedor agregado: ${proveedor.nombre}`, 'success');
            return proveedor;
        }
        
        function editarProveedor(id, datos) {
            const index = db.proveedores.findIndex(p => p.id === id);
            if (index !== -1) {
                db.proveedores[index] = { ...db.proveedores[index], ...datos };
                guardarDB();
                mostrarNotificacion(`✏️ Proveedor actualizado: ${db.proveedores[index].nombre}`, 'success');
                return true;
            }
            return false;
        }
        
        function eliminarProveedor(id) {
            if (confirm("⚠️ ¿Eliminar este proveedor?")) {
                db.proveedores = db.proveedores.filter(p => p.id !== id);
                guardarDB();
                mostrarNotificacion("🗑️ Proveedor eliminado", 'info');
                renderConfiguracion();
            }
        }
        
        function registrarVenta(clienteId, montoNeto, iva, tipoComprobante, numComprobante, fechaVenta) {
            const cliente = db.clientes.find(c => c.id === clienteId);
            if (!cliente) return null;
            const ivaMonto = montoNeto * (iva / 100);
            const total = montoNeto + ivaMonto;
            const fechaCobroEsperada = new Date(fechaVenta);
            fechaCobroEsperada.setDate(fechaCobroEsperada.getDate() + cliente.diasCobro);
            const venta = {
                id: generarId(), clienteId, clienteNombre: cliente.nombre, montoNeto, iva, ivaMonto, total,
                tipoComprobante, numComprobante, fechaVenta, fechaCobroEsperada: fechaCobroEsperada.toISOString().split('T')[0],
                mes: fechaVenta.substring(0, 7), estado: 'pendiente_cobro', registrada: new Date().toISOString()
            };
            db.ventas.push(venta);
            cliente.saldo = (cliente.saldo || 0) + total;
            guardarDB();
            mostrarNotificacion(`✅ Venta registrada a ${cliente.nombre} por $${formatNumber(total)}`, 'success');
            return venta;
        }
        
        function registrarCobro(ventaId, fechaCobro, comprobanteCobro) {
            const venta = db.ventas.find(v => v.id === ventaId);
            if (!venta) return false;
            const cliente = db.clientes.find(c => c.id === venta.clienteId);
            venta.estado = 'cobrado';
            venta.fechaCobro = fechaCobro;
            venta.comprobanteCobro = comprobanteCobro;
            if (cliente) cliente.saldo = (cliente.saldo || 0) - venta.total;
            const diasDiferencia = Math.ceil((new Date(fechaCobro) - new Date(venta.fechaCobroEsperada)) / (1000 * 60 * 60 * 24));
            venta.diasDiferencia = diasDiferencia;
            venta.estadoPago = diasDiferencia <= 0 ? 'En término' : `Atrasado ${diasDiferencia} días`;
            db.pagosHistorial.unshift({ id: generarId(), tipo: 'cobro', ventaId, monto: venta.total, fecha: fechaCobro, comprobante: comprobanteCobro });
            guardarDB();
            mostrarNotificacion(`💰 Cobro registrado de ${venta.clienteNombre} por $${formatNumber(venta.total)}`, 'success');
            return true;
        }
        
        function registrarCompra(proveedorId, montoNeto, iva, tipoComprobante, numComprobante, fechaCompra) {
            const proveedor = db.proveedores.find(p => p.id === proveedorId);
            if (!proveedor) return null;
            const ivaMonto = montoNeto * (iva / 100);
            const total = montoNeto + ivaMonto;
            const fechaPagoEsperada = new Date(fechaCompra);
            fechaPagoEsperada.setDate(fechaPagoEsperada.getDate() + proveedor.diasPago);
            const compra = {
                id: generarId(), proveedorId, proveedorNombre: proveedor.nombre, montoNeto, iva, ivaMonto, total,
                tipoComprobante, numComprobante, fechaCompra, fechaPagoEsperada: fechaPagoEsperada.toISOString().split('T')[0],
                mes: fechaCompra.substring(0, 7), estado: 'pendiente_pago', registrada: new Date().toISOString()
            };
            db.compras.push(compra);
            proveedor.saldo = (proveedor.saldo || 0) + total;
            guardarDB();
            mostrarNotificacion(`🛒 Compra registrada a ${proveedor.nombre} por $${formatNumber(total)}`, 'success');
            return compra;
        }
        
        function registrarPagoCompra(compraId, fechaPago, comprobantePago) {
            const compra = db.compras.find(c => c.id === compraId);
            if (!compra) return false;
            const proveedor = db.proveedores.find(p => p.id === compra.proveedorId);
            compra.estado = 'pagado';
            compra.fechaPago = fechaPago;
            compra.comprobantePago = comprobantePago;
            if (proveedor) proveedor.saldo = (proveedor.saldo || 0) - compra.total;
            const diasDiferencia = Math.ceil((new Date(fechaPago) - new Date(compra.fechaPagoEsperada)) / (1000 * 60 * 60 * 24));
            compra.diasDiferencia = diasDiferencia;
            compra.estadoPago = diasDiferencia <= 0 ? 'En término' : `Atrasado ${diasDiferencia} días`;
            db.pagosHistorial.unshift({ id: generarId(), tipo: 'pago', compraId, monto: compra.total, fecha: fechaPago, comprobante: comprobantePago });
            guardarDB();
            mostrarNotificacion(`💸 Pago registrado a ${compra.proveedorNombre} por $${formatNumber(compra.total)}`, 'success');
            return true;
        }
        
        function pagarCostoFijo(id, fechaPago, comprobante) {
            const costo = db.costosFijos.find(c => c.id === id);
            if (!costo) return false;
            costo.estado = 'pagado';
            costo.fechaPago = fechaPago;
            costo.comprobante = comprobante;
            db.pagosHistorial.unshift({ id: generarId(), tipo: 'costoFijo', costoId: id, nombre: costo.nombre, monto: costo.monto, fecha: fechaPago, comprobante });
            if (costo.recurrente) {
                const nuevaFecha = new Date(costo.vencimiento);
                nuevaFecha.setMonth(nuevaFecha.getMonth() + 1);
                registrarCostoFijo(costo.nombre, costo.monto, nuevaFecha.toISOString().split('T')[0], costo.categoria, true);
            }
            guardarDB();
            mostrarNotificacion(`✅ Pagado: ${costo.nombre} - $${formatNumber(costo.monto)}`, 'success');
            renderConfiguracion();
            return true;
        }
        
        function eliminarCostoFijo(id) {
            if (confirm("⚠️ ¿Eliminar este costo fijo?")) {
                db.costosFijos = db.costosFijos.filter(c => c.id !== id);
                guardarDB();
                mostrarNotificacion("🗑️ Costo fijo eliminado", 'info');
                renderConfiguracion();
            }
        }
        
        function registrarCostoFijo(nombre, monto, vencimiento, categoria, recurrente) {
            const costo = { id: generarId(), nombre, monto, vencimiento, estado: 'pendiente', categoria, recurrente, registrado: new Date().toISOString() };
            db.costosFijos.push(costo);
            guardarDB();
            mostrarNotificacion(`💰 Costo fijo agregado: ${nombre}`, 'success');
            renderConfiguracion();
        }
        
        // ========== REPORTES ==========
        function getDatosGraficos() {
            const meses = [...new Set([...db.ventas.map(v => v.mes), ...db.compras.map(c => c.mes)])].sort();
            const ventasPorMes = meses.map(m => db.ventas.filter(v => v.mes === m).reduce((s, v) => s + v.total, 0));
            const comprasPorMes = meses.map(m => db.compras.filter(c => c.mes === m).reduce((s, c) => s + c.total, 0));
            return { meses, ventasPorMes, comprasPorMes };
        }
        
        function calcularReporteMes(mes) {
            const ventasMes = db.ventas.filter(v => v.mes === mes);
            const comprasMes = db.compras.filter(c => c.mes === mes);
            const costosFijosMes = db.costosFijos.filter(cf => cf.vencimiento?.substring(0, 7) === mes && cf.estado === 'pagado');
            const ventasNetas = ventasMes.reduce((s, v) => s + v.montoNeto, 0);
            const comprasNetas = comprasMes.reduce((s, c) => s + c.montoNeto, 0);
            const ivaCobrado = ventasMes.reduce((s, v) => s + v.ivaMonto, 0);
            const ivaPagado = comprasMes.reduce((s, c) => s + c.ivaMonto, 0);
            const ivaAPagar = ivaCobrado - ivaPagado > 0 ? ivaCobrado - ivaPagado : 0;
            const costosFijosTotal = costosFijosMes.reduce((s, c) => s + c.monto, 0);
            const resultado = ventasNetas - comprasNetas - costosFijosTotal - ivaAPagar;
            const rentabilidad = ventasNetas > 0 ? (resultado / ventasNetas * 100).toFixed(2) : 0;
            return { mes, ventasNetas, comprasNetas, ivaCobrado, ivaPagado, ivaAPagar, costosFijosTotal, resultado, rentabilidad, cantidadVentas: ventasMes.length, cantidadCompras: comprasMes.length };
        }
        
        function calcularAcumuladoAnual() {
            const meses = [...new Set([...db.ventas.map(v => v.mes), ...db.compras.map(c => c.mes)])].sort();
            let acumulado = { ventasNetas: 0, comprasNetas: 0, ivaCobrado: 0, ivaPagado: 0, costosFijosTotal: 0, resultado: 0 };
            meses.forEach(m => { const r = calcularReporteMes(m); acumulado.ventasNetas += r.ventasNetas; acumulado.comprasNetas += r.comprasNetas; acumulado.ivaCobrado += r.ivaCobrado; acumulado.ivaPagado += r.ivaPagado; acumulado.costosFijosTotal += r.costosFijosTotal; acumulado.resultado += r.resultado; });
            acumulado.ivaAPagar = acumulado.ivaCobrado - acumulado.ivaPagado > 0 ? acumulado.ivaCobrado - acumulado.ivaPagado : 0;
            acumulado.rentabilidad = acumulado.ventasNetas > 0 ? (acumulado.resultado / acumulado.ventasNetas * 100).toFixed(2) : 0;
            return acumulado;
        }
        
        // ========== RENDER DASHBOARD PROFESIONAL ==========
        function renderDashboard() {
            const meses = [...new Set([...db.ventas.map(v => v.mes), ...db.compras.map(c => c.mes)])].sort().reverse();
            const mesActual = meses[0] || new Date().toISOString().substring(0, 7);
            const reporte = calcularReporteMes(mesActual);
            const acumulado = calcularAcumuladoAnual();
            const empresa = db.empresas.find(e => e.id === db.empresaActiva) || db.empresas[0];
            
            setTimeout(() => {

            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content"><h2 class="text-xl font-bold mb-4">💰 Pagar Compra</h2><p class="mb-3">${c.proveedorNombre} - <span class="font-bold text-red-600">$${formatNumber(c.total)}</span></p>
                <input type="date" id="fechaPago" value="${new Date().toISOString().split('T')[0]}" class="w-full p-3 border rounded-xl mb-3">
                <input type="text" id="comprobante" placeholder="Comprobante" class="w-full p-3 border rounded-xl mb-3">
                <div class="flex gap-3"><button onclick="confirmarPagoModal(${id})" class="flex-1 bg-green-600 text-white py-3 rounded-xl">Registrar</button><button onclick="cancelarModal()" class="flex-1 bg-gray-300 py-3 rounded-xl">Cancelar</button></div></div></div>`;
        }
        
        window.confirmarPagoModal = (id) => { registrarPagoCompra(id, document.getElementById('fechaPago').value, document.getElementById('comprobante').value); cancelarModal(); renderCompras(); };
        
        function pagarCostoFijoModal(id) {
            const cf = db.costosFijos.find(x => x.id === id);
            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content"><h2 class="text-xl font-bold mb-4">💰 Pagar ${cf.nombre}</h2><p class="mb-3">Monto: <span class="font-bold">$${formatNumber(cf.monto)}</span></p>
                <input type="date" id="fechaPago" value="${new Date().toISOString().split('T')[0]}" class="w-full p-3 border rounded-xl mb-3">
                <input type="text" id="comprobante" placeholder="Comprobante" class="w-full p-3 border rounded-xl mb-3">
                <div class="flex gap-3"><button onclick="confirmarPagoCostoModal(${id})" class="flex-1 bg-green-600 text-white py-3 rounded-xl">Pagar</button><button onclick="cancelarModal()" class="flex-1 bg-gray-300 py-3 rounded-xl">Cancelar</button></div></div></div>`;
        }
        
        window.confirmarPagoCostoModal = (id) => { pagarCostoFijo(id, document.getElementById('fechaPago').value, document.getElementById('comprobante').value); cancelarModal(); renderConfiguracion(); };
        
        function mostrarModalAgregarCostoFijo() {
            document.getElementById('root').innerHTML = `<div class="modal"><div class="modal-content w-full max-w-md"><h2 class="text-xl font-bold mb-4">💰 Agregar Costo Fijo</h2>
                <div class="space-y-3">
                    <input type="text" id="nombre" placeholder="Nombre" class="w-full p-3 border rounded-xl">
                    <input type="number" id="monto" placeholder="Monto" class="w-full p-3 border rounded-xl">
                    <input type="date" id="vencimiento" class="w-full p-3 border rounded-xl">
                    <select id="categoria" class="w-full p-3 border rounded-xl">${db.categoriasGastos.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
                    <label class="flex items-center gap-2"><input type="checkbox" id="recurrente"> Recurrente (mensual)</label>
                </div>
                <div class="flex gap-3 mt-5"><button onclick="guardarCostoFijoModal()" class="flex-1 bg-green-600 text-white py-3 rounded-xl">Guardar</button><button onclick="cancelarModal()" class="flex-1 bg-gray-300 py-3 rounded-xl">Cancelar</button></div></div></div>`;
        }
        
        window.guardarCostoFijoModal = () => {
            const nombre = document.getElementById('nombre').value;
            const monto = parseFloat(document.getElementById('monto').value);
            if (!nombre || isNaN(monto)) { mostrarNotificacion("Complete los datos", 'error'); return; }
            registrarCostoFijo(nombre, monto, document.getElementById('vencimiento').value, document.getElementById('categoria').value, document.getElementById('recurrente').checked);
            cancelarModal();
            renderConfiguracion();
        };
        
        function mostrarModalNuevoPresupuesto() { mostrarNotificacion("Disponible en la próxima actualización", 'info'); }
        function mostrarModalEscanearPresupuesto() { mostrarNotificacion("Función de escaneo disponible", 'info'); }
        function verPresupuestoDetalle(id) { mostrarNotificacion(`Presupuesto #${id}`, 'info'); }
        function exportarPresupuestoPDF(id) { mostrarNotificacion("Exportando PDF...", 'info'); }
        function exportarReportePDF(mes) { mostrarNotificacion(`Exportando reporte ${mes}...`, 'info'); }
        function exportarBackup() { mostrarNotificacion("Backup exportado", 'success'); }
        function importarBackup(file) { mostrarNotificacion("Backup importado", 'success'); }
        function exportarExcel() { mostrarNotificacion("Exportando a Excel...", 'info'); }
        function limpiarNotificaciones() { db.notificaciones = []; guardarDB(); renderConfiguracion(); mostrarNotificacion("Notificaciones limpiadas", 'success'); }
        
        window.cancelarModal = () => { showView(currentView); };
        
        // ========== NAVEGACIÓN ==========
        let currentView = 'dashboard';
        window.showView = (view) => {
            currentView = view;
            const views = { dashboard: renderDashboard, ventas: renderVentas, compras: renderCompras, presupuestos: renderPresupuestos, reportes: renderReportes, contador: renderContador, configuracion: renderConfiguracion };
            document.getElementById('root').innerHTML = views[view]();
        };
        
        if (darkMode) document.body.classList.add('dark');
        showView('dashboard');
    </script>
</body>
</html>
